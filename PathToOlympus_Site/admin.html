<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5E3815">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Olympus · Council</title>
<link rel="manifest" href="admin.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/admin-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>

<script src="config.js"></script>
<script src="engine.js"></script>
<script src="core.js"></script>
<script>
/* =============================================================================
 * Admin console: PIN → Overview · Plans · Targets · Scoring · Media · Guide · Settings
 * ========================================================================== */
(function () {
  'use strict';
  const O = window.Olympus, E = O.E, S = O.S, esc = O.esc;

  const A = {
    sub: 'overview',
    pinMsg: '',
    dayEdit: null,        // { date, entries:[{exercise, level, perSet}], reason }
    davidReady: undefined, // is David's code set?
    busy: false,
    planDraft: null,
    openDay: 'MONDAY',
    targetDrafts: {},
    scDraft: null,
    mediaOpen: 'exercises',
    month: null,
    metric: 'POINTS',
    settings: null,
    questDraft: null,
    rewardDraft: null,
    reportMonth: null,
    report: false,
  };
  const blankDay = () => ({ targetMinutes: 0, note: '', exercises: [] });
  const clone = (x) => JSON.parse(JSON.stringify(x));

  /* ------------------------------- shell ------------------------------- */

  function topbar() {
    const p = O.profile();
    const showLock = unlocked();
    return `<header class="topbar"><div class="in">${O.laurelSVG(34, O.C.gold)}
      <div class="grow"><h1>COUNCIL OF OLYMPUS</h1><div class="motto">${unlocked() && O.loaded() ? `${esc(p.name)}: ${O.n0(p.score)} pts · streak ${O.n0(p.currentStreak)} · ${O.n0(p.daysDone)} done / ${O.n0(p.daysLost)} lost` : O.MOTTO}</div></div>
      ${showLock ? '<button class="back" data-act="lock" aria-label="Lock">🔒</button>' : ''}
    </div><div class="meander"></div></header>${O.demoBarHTML()}${S.error ? `<div class="error-bar">${esc(S.error)}</div>` : ''}`;
  }

  /* ------------------------------ login / PIN ------------------------------ */

  /** One screen: the PIN. First time ever it creates the PIN; on a new phone it checks it. */
  function pinScreen() {
    const st = S.adminState;
    if (!S.user || !st) return `<div class="empty">${O.laurelSVG(100)}<p>Opening the council…</p></div>`;
    const creating = !st.ready;
    const box = (id, ph) => `<input id="${id}" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="${ph}" class="pin-box">`;
    return `<div class="card center pin-card">${O.laurelSVG(90)}<h2>${creating ? 'Create your Admin PIN' : 'Enter Admin PIN'}</h2>
      <p class="muted small">${creating ? 'Choose 4–8 digits. This one PIN opens the Admin on any phone or computer.' : st.registered ? 'This device is already trusted.' : 'First time on this device — the PIN connects it.'}</p>
      ${box('pin', 'PIN')}${creating ? box('pin2', 'Repeat PIN') : ''}
      ${A.pinMsg ? `<p class="bad small">${esc(A.pinMsg)}</p>` : ''}
      <button class="btn-gold" data-act="pin-go" ${A.busy ? 'disabled' : ''}>${A.busy ? 'Checking…' : creating ? 'Create PIN' : 'Enter the council'}</button></div>`;
  }

  /* -------------------------------- overview -------------------------------- */

  function overview() {
    const p = O.profile();
    const plan = O.todayPlan(), log = O.todayLog();
    let today;
    if (log && log.status === 'DONE') today = `<span class="${log.complete === false ? 'warn' : 'ok'}">Closed · ${O.n0(log.pct)}% · +${O.fmtNum(log.points)} pts</span>`;
    else {
      const st = E.dayStats(plan, (log && log.entries) || [], S.scoring);
      today = !plan || E.isRest(plan) ? `No plan today${st.points ? ` · ${O.fmtNum(st.points)} pts logged` : ''}` : `In progress: ${O.fmtNum(st.points)} / ${O.fmtNum(st.planned)} pts (${st.pct}%)${st.plannedMinutes ? ` · ${st.minutes}/${st.plannedMinutes} min timed` : ''}`;
    }
    return `<div class="card"><div class="row">${O.avatarHTML(p, 64)}<div class="grow"><h3>${esc(p.name)}</h3>
        <div class="small">Glory <b>${O.fmtNum(p.score)}</b> · streak <b>${O.n0(p.currentStreak)}</b> (best ${O.n0(p.bestStreak)})</div>
        <div class="small muted">Journey started ${p.startDate ? O.fmtDate(p.startDate) : '— (starts when David first opens his app)'}</div></div></div>
        <div class="small">Rank <b>${esc(O.rank().rank.title)}</b> · treasury ◎ ${O.fmtNum(O.treasury())}</div>
        <p class="small" style="margin-top:10px"><b>Today:</b> ${today} <button class="btn-text" data-act="day" data-date="${S.today}">Details</button></p></div>`
      + requestsCard(false) + messagesCard() + O.calendarCard(A.month) + O.totalsCard() + O.trendsCard(A.metric) + O.trajectoryCard() + O.horizonsCard();
  }

  /* ------------------------- Admin: fix / excuse a day ------------------------- */

  function openDayEdit(date) {
    const log = S.logs[date], plan = O.planForDate(date);
    const fromLog = ((log && log.entries) || []).filter(E.isActive).map((e) => ({ exercise: e.exercise, level: e.level || 1, perSet: E.setList(e) }));
    const ids = new Set(fromLog.map((e) => e.exercise));
    const fromPlan = ((plan && plan.exercises) || []).filter((p) => !ids.has(p.exercise)).map((p) => ({ exercise: p.exercise, level: p.level || 1, perSet: [] }));
    A.dayEdit = { date, entries: fromLog.concat(fromPlan), reason: (log && log.reason) || '' };
  }

  function dayEditCard() {
    const de = A.dayEdit, date = de.date, log = S.logs[date], future = date > S.today;
    const status = !log ? (future ? 'Upcoming' : 'Nothing recorded') : log.status === 'DONE' ? `Closed · ${O.n0(log.pct)}% · ${O.fmtNum(log.points)} pts` : log.status === 'LOST' ? 'Skipped' : log.status === 'EXCUSED' ? 'Excused' : 'In progress (not closed)';
    let html = `<div class="card day-edit"><div class="row"><h3 class="grow">${O.fmtDate(date, 'long')}</h3><button class="btn-text" data-act="de-cancel">✕</button></div>
      <p class="small">Now: <b>${esc(status)}</b>${log && log.editedByAdmin ? ' · edited by you' : ''}</p>`;
    if (!future) {
      html += `<p class="muted small">Change what David did, then save. Points, streak and totals are recalculated for the whole journey.</p>`;
      de.entries.forEach((e, i) => {
        const info = E.EX[e.exercise], pts = E.exercisePoints({ exercise: e.exercise, level: e.level, perSet: e.perSet }, S.scoring);
        html += `<div class="inset"><div class="row"><b class="grow">${esc(info.name)}</b><span class="ex-pts">${O.fmtNum(pts)} pts</span><button class="btn-text danger-text" data-act="de-rm" data-i="${i}">✕</button></div>
          <div class="levels" style="margin:6px 0">${[1, 2, 3].map((n) => `<button class="${e.level === n ? 'on' : ''}" data-act="de-lv" data-i="${i}" data-lv="${n}">${E.lvl(n).roman}</button>`).join('')}</div>
          ${O.setsEditorHTML(e.exercise, e.perSet, `data-scope="day" data-row="${i}"`)}</div>`;
      });
      const left = E.EXERCISES.filter((x) => !de.entries.some((e) => e.exercise === x.id));
      if (left.length) html += `<label class="field"><span>Add exercise</span><select data-change="de-add"><option value="">＋ Choose…</option>${left.map((x) => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label>`;
      const pts = E.dayPoints(de.entries.map((e) => ({ ...e })), S.scoring);
      html += `<button class="btn-gold" data-act="de-save" ${de.entries.some((e) => E.isActive(e)) ? '' : 'disabled'}>Save as a closed day · ${O.fmtNum(pts)} pts</button>`;
    }
    html += `<div class="inset" style="margin-top:12px"><b>Excuse this day</b><p class="muted small">Sick, travelling, a family day… No penalty, the streak goes on.</p>
      <input data-bind="de-reason" placeholder="Reason (optional, David sees it)" value="${esc(de.reason)}">
      <button class="btn-line" data-act="de-excuse" style="margin-top:8px">Excuse ${future ? 'in advance' : 'this day'}</button></div>
      <div class="row" style="margin-top:12px;flex-wrap:wrap;gap:6px">
        ${!future && log && log.status !== 'LOST' ? '<button class="btn-text danger-text" data-act="de-lost">Mark as skipped</button>' : ''}
        ${date === S.today && log && log.status !== 'PENDING' ? '<button class="btn-text" data-act="de-reopen">Reopen for David</button>' : ''}
        ${log ? '<button class="btn-text" data-act="de-clear">Remove this record</button>' : ''}
      </div></div>`;
    return html;
  }

  /* ----------------------- v6: messages + shop requests ----------------------- */

  function messagesCard() {
    const list = S.messages.slice(0, 6).map((m) => `<div class="msg-old"><div class="row"><span class="muted tiny grow">${O.fmtMillis(m.at)} · ${m.readAt ? 'seen ✓' : 'not seen yet'}${m.reaction ? ' · David: ' + m.reaction : ''}</span>
      <button class="btn-text danger-text" data-act="msg-del" data-id="${m.id}">✕</button></div><p>${esc(m.text)}</p></div>`).join('');
    return `<div class="card">${O.section('Message to David')}<textarea id="msg-text" rows="3" maxlength="500" placeholder="Praise, a tip, or a challenge… It appears on his home screen."></textarea>
      <button class="btn-line" data-act="msg-send" style="margin-top:8px">Send</button>${list ? `<div style="margin-top:10px">${list}</div>` : ''}</div>`;
  }
  function requestsCard(all) {
    const pend = S.requests.filter((r) => r.status === 'PENDING');
    if (!all && !pend.length) return '';
    const row = (r) => `<div class="req ${r.status.toLowerCase()}"><span>${esc(r.emoji || '🎁')}</span><div class="grow"><b>${esc(r.title)}</b><div class="muted tiny">${O.fmtMillis(r.at)} · ◎ ${O.fmtNum(r.cost)}${r.note ? ' · ' + esc(r.note) : ''}</div></div>
      ${r.status === 'PENDING' ? `<button class="btn-line small-btn" data-act="req-yes" data-id="${r.id}">Approve</button><button class="btn-text danger-text" data-act="req-no" data-id="${r.id}">Decline</button>` : `<span class="req-st">${r.status === 'APPROVED' ? '✅' : '✕'}</span>`}</div>`;
    const done = all ? S.requests.filter((r) => r.status !== 'PENDING').slice(0, 20) : [];
    return `<div class="card">${O.section(pend.length ? `Shop requests · ${pend.length} waiting` : 'Shop requests')}${pend.map(row).join('') || '<p class="muted small">Nothing waiting.</p>'}
      ${done.length ? `<div class="muted tiny" style="margin-top:8px">History</div>${done.map(row).join('')}` : ''}</div>`;
  }

  /* --------------------------------- quests --------------------------------- */

  const QUEST_TEMPLATES = [
    ['150 push-ups this week', { kind: 'reps', exercise: 'PUSH_UPS', goal: 150, bonus: 150 }],
    ['50 pull-ups this week', { kind: 'reps', exercise: 'PULL_UPS', goal: 50, bonus: 200 }],
    ['10 min of plank this week', { kind: 'reps', exercise: 'PLANK', goal: 600, bonus: 200 }],
    ['Close 5 days this week', { kind: 'days', goal: 5, bonus: 150 }],
    ['1,000 points this week', { kind: 'points', goal: 1000, bonus: 150 }],
  ];
  function newQuest(tpl) {
    const from = S.today, mon = E.mondayOf(S.today);
    return { id: '', title: tpl ? tpl[0] : '', kind: 'reps', exercise: 'PUSH_UPS', goal: 100, bonus: 100, from, days: tpl ? E.diffDays(from, E.addDays(mon, 6)) + 1 : 7, ...(tpl ? tpl[1] : {}) };
  }
  function questEditor() {
    const q = A.questDraft, to = E.addDays(q.from, Math.max(1, q.days) - 1);
    const timed = q.kind === 'reps' && E.isTimed(q.exercise);
    return `<div class="card">${O.section(q.id ? 'Edit quest' : 'New quest')}
      ${q.id ? '' : `<div class="chips" style="flex-wrap:wrap;margin-bottom:8px">${QUEST_TEMPLATES.map((t, i) => `<button class="chip" data-act="q-tpl" data-i="${i}">${esc(t[0])}</button>`).join('')}</div>`}
      <label class="field"><span>Title (what David sees)</span><input data-bind="q" data-f="title" value="${esc(q.title)}" placeholder="${esc(E.questGoalText(q))}"></label>
      <label class="field"><span>What counts</span><select data-change="q-kind">${E.QUEST_KINDS.map((k) => `<option value="${k.id}" ${q.kind === k.id ? 'selected' : ''}>${esc(k.label)}</option>`).join('')}</select></label>
      ${q.kind === 'reps' ? `<label class="field"><span>Exercise</span><select data-change="q-ex">${E.EXERCISES.map((x) => `<option value="${x.id}" ${q.exercise === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>` : ''}
      <div class="grid2"><label class="field"><span>Goal${timed ? ' (seconds)' : q.kind === 'reps' ? ` (${E.EX[q.exercise].unit})` : ''}</span><input inputmode="numeric" data-bind="q" data-f="goal" value="${esc(q.goal)}"></label>
      <label class="field"><span>Bonus Glory</span><input inputmode="numeric" data-bind="q" data-f="bonus" value="${esc(q.bonus)}"></label></div>
      ${timed ? `<p class="muted small">${E.fmtSecs(O.n0(q.goal))} in total.</p>` : ''}
      <div class="row"><div class="grow">Starts</div><button class="icon" data-act="q-from" data-d="-1">‹</button><b>${O.fmtDate(q.from, 'day')}</b><button class="icon" data-act="q-from" data-d="1">›</button></div>
      <div class="row" style="margin-top:6px"><div class="grow">Lasts</div>${stepper('days', q.days, 'data-act="q-days"', 1, 1, 92)}</div>
      <p class="muted small">From ${O.fmtDate(q.from, 'day')} to ${O.fmtDate(to, 'day')}. David's closed days in these dates count. When he reaches the goal, he gets the bonus and a celebration.</p>
      <div class="row"><button class="btn-line grow" data-act="q-cancel" style="min-height:52px">Cancel</button><div class="grow"><button class="btn-gold" data-act="q-save">Save quest</button></div></div></div>`;
  }
  function questsTab() {
    if (A.questDraft) return questEditor();
    const la = O.logsArr();
    const label = { active: 'ACTIVE', upcoming: 'UPCOMING', done: 'DONE ✓', missed: 'MISSED' };
    let html = `<button class="btn-gold" data-act="q-new">New quest</button><div style="height:14px"></div>`;
    if (!S.quests.length) html += `<p class="muted">Quests are challenges with dates and a bonus — "150 push-ups this week". They show on David's home with a progress bar.</p>`;
    S.quests.forEach((q) => {
      const st = E.questState(q, S.today, la), pr = E.questProgress(q, la), timed = q.kind === 'reps' && E.isTimed(q.exercise);
      html += `<div class="card quest ${st}"><div class="row"><b class="grow">${esc(q.title || E.questGoalText(q))}</b><span class="tag ${st === 'done' ? 'active' : st === 'missed' ? 'danger-text' : 'ghost'}">${label[st]}</span></div>
        <div class="muted small">${esc(E.questGoalText(q))} · ${O.fmtDate(q.from, 'dm')} – ${O.fmtDate(q.to, 'dm')} · +${O.fmtNum(q.bonus)} Glory${q.claimedAt ? ' · paid' : ''}</div>
        ${O.bar(pr.frac, st === 'upcoming')}<div class="q-nums">${timed ? `${E.fmtSecs(pr.have)} / ${E.fmtSecs(pr.goal)}` : `${O.fmtNum(pr.have)} / ${O.fmtNum(pr.goal)}`}</div>
        <div class="row"><button class="btn-text" data-act="q-edit" data-id="${q.id}">Edit</button><button class="btn-text" data-act="q-copy" data-id="${q.id}">Repeat next week</button><button class="btn-text danger-text" data-act="q-del" data-id="${q.id}">Delete</button></div></div>`;
    });
    return html;
  }

  /* ---------------------------------- shop ---------------------------------- */

  function shopTab() {
    const r = A.rewardDraft || (A.rewardDraft = { emoji: '🎁', title: '', cost: 1000, note: '' });
    let html = `<div class="card"><p class="small">David spends his <b>treasury</b> here: Glory minus what he already asked for. His Glory score and rank never go down.
      Treasury now: <b>◎ ${O.fmtNum(O.treasury())}</b> (Glory ${O.fmtNum(O.profile().score)} − spent ${O.fmtNum(O.spent())}).</p>
      <p class="muted small">Tip: David earns about ${O.fmtNum(Math.round(O.baseline().pointsPerDay || 150))} Glory a day. A 1-week reward ≈ ${O.fmtNum(Math.round((O.baseline().pointsPerDay || 150) * 7 / 100) * 100)}.</p></div>`;
    html += requestsCard(true);
    html += `<div class="card">${O.section('Rewards')}`;
    html += S.rewards.map((x) => `<div class="reward ${x.active === false ? 'locked' : ''}"><span class="rw-emoji">${esc(x.emoji || '🎁')}</span><div class="grow"><b>${esc(x.title)}</b>${x.note ? `<div class="muted small">${esc(x.note)}</div>` : ''}<div class="rw-cost">◎ ${O.fmtNum(x.cost)}</div></div>
      <button class="btn-text" data-act="rw-toggle" data-id="${x.id}">${x.active === false ? 'Show' : 'Hide'}</button><button class="btn-text danger-text" data-act="rw-del" data-id="${x.id}">✕</button></div>`).join('') || '<p class="muted small">No rewards yet — add the first one below.</p>';
    html += `</div><div class="card">${O.section('Add a reward')}
      <div class="grid2"><label class="field"><span>Emoji</span><input data-bind="rw" data-f="emoji" value="${esc(r.emoji)}" maxlength="4"></label><label class="field"><span>Price (Glory)</span><input inputmode="numeric" data-bind="rw" data-f="cost" value="${esc(r.cost)}"></label></div>
      <label class="field"><span>Reward</span><input data-bind="rw" data-f="title" value="${esc(r.title)}" placeholder="Pizza night, new game, a day off training…"></label>
      <label class="field"><span>Note (optional)</span><input data-bind="rw" data-f="note" value="${esc(r.note)}"></label>
      <button class="btn-gold" data-act="rw-add">Add reward</button></div>`;
    return html;
  }

  /* -------------------------------- insights -------------------------------- */

  const dismissed = () => { try { return JSON.parse(localStorage.getItem('olympus_prog_dismissed')) || []; } catch (e) { return []; } };
  function progressionCard() {
    const list = E.progressionSuggestions(S.today, S.logs, O.planForDate).filter((s) => !dismissed().includes(s.key));
    const f = (id, l) => l.map((v) => (E.isTimed(id) ? E.fmtSecs(v) : v)).join(' · ');
    const rows = list.map((s) => `<div class="inset prog"><b>${esc(E.EX[s.exercise].name)}</b>
      <div class="small">Hit the target the last ${s.hits} times. Suggest: ${E.lvl(s.level).roman} ${f(s.exercise, s.from)} → <b>${E.lvl(s.newLevel).roman} ${f(s.exercise, s.to)}</b>${s.newLevel > s.level ? ' (next level, fewer reps)' : ''}</div>
      <div class="row"><button class="btn-line small-btn" data-act="prog-apply" data-key="${esc(s.key)}">Apply to the plan</button><button class="btn-text" data-act="prog-dismiss" data-key="${esc(s.key)}">Not now</button></div></div>`).join('');
    return `<div class="card">${O.section('Smart progression')}${rows || '<p class="muted small">No suggestions right now. When David reaches the plan 3 times in a row for an exercise, a suggestion to raise it appears here.</p>'}</div>`;
  }
  function reportCard() {
    const m = A.reportMonth || (A.reportMonth = S.today.slice(0, 7));
    const [y, mo] = m.split('-').map(Number);
    return `<div class="card">${O.section('Monthly report (PDF)')}<div class="row"><button class="icon" data-act="rp-month" data-dir="-1">‹</button><b class="grow center">${['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][mo - 1]} ${y}</b><button class="icon" data-act="rp-month" data-dir="1">›</button></div>
      <p class="muted small">Opens a one-page report. In the print window choose <b>Save as PDF</b>.</p><button class="btn-line" data-act="rp-open">📄 Create the report</button></div>`;
  }
  function testsAdminCard() {
    if (!S.tests.length) return `<div class="card">${O.section('Trial of Heracles')}<p class="muted small">David can take the monthly strength test from his home screen. Results appear here.</p></div>`;
    return O.testsCard() + `<div class="card"><p class="muted small">Remove a test (for example if it was entered by mistake): David can then take it again this month.</p>${S.tests.slice().reverse().map((t) => `<button class="btn-text danger-text" data-act="test-del" data-id="${t.id}">✕ ${t.id}</button>`).join(' ')}</div>`;
  }
  const insightsTab = () => progressionCard() + O.weekdayCard() + O.heatmapCard() + testsAdminCard() + reportCard();

  /* ------------------------------- day editor ------------------------------- */

  function stepper(label, value, attrs, step, min, max) {
    return `<div class="stepper"><label>${esc(label)}</label><div class="box">
      <button ${attrs} data-d="${-step}" ${value <= min ? 'disabled' : ''}>−</button><b>${value}</b>
      <button ${attrs} data-d="${step}" ${value >= max ? 'disabled' : ''}>+</button></div></div>`;
  }

  /** One day of the weekly plan: exercises with a level and each set (reps, or seconds when timed). */
  function dayEditor(day, k) {
    const at = (act, extra = '') => `data-act="${act}" data-k="${k}" ${extra}`;
    const pts = E.plannedPoints(day, S.scoring), mins = E.plannedMinutes(day);
    let html = `<p class="small"><b>${O.fmtNum(pts)} points</b>${mins ? ` · ${mins} min timed` : ''} planned</p>`;
    (day.exercises || []).forEach((p, i) => {
      const info = E.EX[p.exercise];
      const exPts = E.exercisePoints(E.planEntry(p), S.scoring);
      html += `<div class="inset"><div class="row"><b class="grow">${esc(info.name)}</b><span class="ex-pts">${O.fmtNum(exPts)} pts</span><button class="btn-text danger-text" ${at('d-rm', `data-i="${i}"`)}>✕</button></div>
        <div class="levels" style="margin:6px 0">${[1, 2, 3].map((n) => `<button class="${p.level === n ? 'on' : ''}" ${at('d-lv', `data-i="${i}" data-lv="${n}"`)}>${E.lvl(n).roman}</button>`).join('')}</div>
        <div class="small muted">${E.isTimed(p.exercise) ? 'Seconds in each set' : 'Reps in each set'} · ${esc(E.fmtSets(E.planEntry(p)))}</div>
        ${O.setsEditorHTML(p.exercise, E.setList(E.planEntry(p)), `data-k="${k}" data-row="${i}"`)}</div>`;
    });
    const remaining = E.EXERCISES.filter((e) => !(day.exercises || []).some((x) => x.exercise === e.id));
    if (remaining.length) {
      html += `<label class="field"><span>Add exercise</span><select data-change="d-add" data-k="${k}"><option value="">＋ Choose…</option>${remaining.map((e) => `<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></label>`;
    }
    html += `<label class="field"><span>Note for David (optional)</span><input data-bind="d-note" data-k="${k}" value="${esc(day.note || '')}"></label>`;
    if (E.isRest(day)) html += `<p class="muted small">No exercises = rest day (never counted as skipped).</p>`;
    return html;
  }

  function dayRef(k) {
    A.planDraft.days[k] = A.planDraft.days[k] || blankDay();
    return A.planDraft.days[k];
  }

  /* --------------------------------- plans --------------------------------- */

  function plansTab() {
    if (A.planDraft) return planEditor();
    let activeId = null, best = null;
    S.plans.forEach((p) => { if (E.planCovers(p, S.today) && (!best || O.n0(p.createdAt) > O.n0(best.createdAt))) best = p; });
    if (best) activeId = best.id;
    let html = `<button class="btn-gold" data-act="plan-new">New weekly plan</button><div style="height:14px"></div>`;
    if (!S.plans.length) html += `<p class="muted">No weekly plans yet. A plan is a 7-day template that repeats automatically for the number of weeks you choose. David logs whatever he really does and closes each day himself.</p>`;
    S.plans.slice().sort((a, b) => O.n0(b.createdAt) - O.n0(a.createdAt)).forEach((p) => {
      const weekPts = E.DOW.reduce((a, d) => a + E.plannedPoints(p.days[d], S.scoring), 0);
      html += `<div class="card"><div class="row"><div class="grow"><h3 style="font-size:16px">${esc(p.name)}</h3>
        <div class="muted small">${O.fmtDate(p.startDate)} → ${O.fmtDate(E.addDays(E.planEnd(p), -1))} · ${p.repeatWeeks} week(s) · ${O.fmtNum(weekPts)} pts/week</div>
        ${p.id === activeId ? '<span class="tag active">ACTIVE TODAY</span>' : ''}</div>
        <button class="btn-text" data-act="plan-edit" data-id="${p.id}">Edit</button><button class="btn-text danger-text" data-act="plan-del" data-id="${p.id}">Delete</button></div></div>`;
    });
    return html;
  }

  function planEditor() {
    const p = A.planDraft;
    const weekPts = E.DOW.reduce((a, d) => a + E.plannedPoints(p.days[d], S.scoring), 0);
    let html = `<div class="card"><label class="field"><span>Plan name</span><input data-bind="p-name" value="${esc(p.name)}"></label>
      <div class="row"><div class="grow">Starts</div><button class="icon" data-act="p-start" data-d="-7">‹</button><b>${O.fmtDate(p.startDate)}</b><button class="icon" data-act="p-start" data-d="7">›</button></div>
      <div class="row" style="margin-top:8px"><div class="grow">Repeat for</div>${stepper('weeks', p.repeatWeeks, 'data-act="p-weeks"', 1, 1, 520)}</div>
      <p class="muted small">Ends ${O.fmtDate(E.addDays(E.planEnd(p), -1))} · <b>${O.fmtNum(weekPts)} points per week</b>. A newer plan covering the same dates takes priority.</p>
      <button class="btn-line" data-act="p-copy">Copy Monday to every day</button></div>`;
    E.DOW.forEach((dow) => {
      const day = p.days[dow] || blankDay();
      const open = A.openDay === dow;
      html += `<div class="card"><div class="row" data-act="p-open" data-dow="${dow}" style="cursor:pointer"><h3 class="grow" style="font-size:16px">${dow[0] + dow.slice(1).toLowerCase()}</h3>
        <span class="muted small">${E.isRest(day) ? 'Rest' : `${day.exercises.length} ex · ${E.plannedMinutes(day)} min · ${O.fmtNum(E.plannedPoints(day, S.scoring))} pts`}</span><span>${open ? '▲' : '▼'}</span></div>
        ${open ? `<div style="margin-top:10px">${dayEditor(day, dow)}</div>` : ''}</div>`;
    });
    html += `<div class="row"><button class="btn-line grow" data-act="plan-cancel" style="min-height:52px">Cancel</button><div class="grow"><button class="btn-gold" data-act="plan-save">Save plan</button></div></div>`;
    return html;
  }

  /* -------------------------------- targets -------------------------------- */

  const TFIELDS = [['points', 'Points ≥'], ['minutes', 'Timed minutes ≥'], ['reps', 'Reps ≥'], ['sets', 'Sets ≥'], ['avgLevel', 'Avg level ≥'], ['maxSkippedPct', 'Skipped days ≤ %'], ['maxMissedPct', 'Missed timed min ≤ %']];
  const fmtT = (k, v) => (k === 'maxSkippedPct' || k === 'maxMissedPct' ? (E.hasMax(v) ? v + '%' : '–') : k === 'avgLevel' ? (O.n0(v) ? v : '–') : O.n0(v) ? O.fmtNum(v) : '–');
  const fmtNow = (k, s) => ({ points: O.fmtNum(s.points), minutes: O.fmtNum(s.minutes), reps: O.fmtNum(s.reps), sets: O.fmtNum(s.sets), avgLevel: s.avgLevel ? s.avgLevel.toFixed(1) : '–', maxSkippedPct: (Math.round(s.skippedPct * 10) / 10) + '%', maxMissedPct: (Math.round(s.missedPct * 10) / 10) + '%' })[k];

  function targetsTab() {
    const b = O.baseline();
    const one = (x) => (Math.round(x * 10) / 10).toString();
    let html = `<div class="card">${O.section('Calibration — Month 1')}${O.labeled('Days observed', `${b.elapsedDays} / ${E.RULES.CALIBRATION_DAYS}`, b.elapsedDays / E.RULES.CALIBRATION_DAYS)}
      <p class="small">David's pace per day: ${one(b.pointsPerDay)} pts · ${one(b.minutesPerDay)} min · ${one(b.repsPerDay)} reps · ${one(b.setsPerDay)} sets · avg level ${one(b.avgLevel)} · skipped ${one(b.skippedPct)}% · missed minutes ${one(b.missedPct)}%</p>
      <p class="muted small">Each target has three versions. <b>Plan</b> is what your weekly plans ask for (the real target, from the points formula). <b>David</b> is his actual pace (the ghost). <b>Target</b> is what counts. Lock a target in to make it official. Only official targets award coats of arms.</p></div>`;
    E.HORIZONS.forEach((h) => {
      const cur = O.target(h.id), stored = S.targets[h.id], plan = O.planTarget(h.id), gh = O.ghost(h.id);
      const { idx, tot } = O.currentBlock(h.id);
      const base = cur.state === 'OFFICIAL' ? cur : gh;
      const dr = A.targetDrafts[h.id] || (A.targetDrafts[h.id] = Object.fromEntries(TFIELDS.map(([k]) => [k, base[k] == null ? '' : base[k]])));
      const rows = TFIELDS.map(([k, l]) => `<tr><td>${l}</td><td>${fmtT(k, plan[k])}</td><td>${fmtT(k, gh[k])}</td><td>${fmtNow(k, tot)}</td></tr>`).join('');
      const inputs = TFIELDS.map(([k, l]) => `<label class="field"><span>${l}</span><input inputmode="decimal" data-bind="tg" data-h="${h.id}" data-f="${k}" value="${esc(dr[k])}" placeholder="${k.startsWith('max') ? 'empty = ignore' : '0 = ignore'}"></label>`).join('');
      html += `<div class="card"><div class="row"><h3 class="grow" style="font-size:16px">${h.title} · per ${h.days} days</h3><span class="tag ${cur.state === 'OFFICIAL' ? 'official' : 'ghost'}">${cur.state}</span></div>
        <table class="cmp"><tr><th></th><th>Plan</th><th>David</th><th>So far${h.repeats ? ' (' + E.roman(idx + 1) + ')' : ''}</th></tr>${rows}</table>
        <div class="grid2">${inputs}</div>
        <div class="row" style="flex-wrap:wrap"><button class="btn-text" data-act="t-fill" data-h="${h.id}" data-src="plan">Use plan</button><button class="btn-text" data-act="t-fill" data-h="${h.id}" data-src="ghost">Use David's pace</button></div>
        <div class="row" style="flex-wrap:wrap">${cur.state === 'GHOST'
          ? `<button class="btn-line" data-act="t-save" data-h="${h.id}">Lock in as official</button>`
          : `<button class="btn-line" data-act="t-save" data-h="${h.id}">Save</button>${stored ? `<button class="btn-text" data-act="t-revert" data-h="${h.id}">${h.master ? 'Back to plan default' : 'Back to ghost'}</button>` : ''}`}</div></div>`;
    });
    return html;
  }

  /* -------------------------------- scoring -------------------------------- */

  function scoringTab() {
    const sc = A.scDraft || (A.scDraft = clone(S.scoring));
    const ex = { exercise: 'PULL_UPS', level: 2, perSet: [10, 8, 6] };
    const exT = { exercise: 'PLANK', level: 2, perSet: [60, 45] };
    const exPts = E.exercisePoints(ex, sc);
    const inp = (path, v, step = '0.1') => `<input inputmode="decimal" data-bind="sc" data-path="${path}" value="${esc(v)}" step="${step}">`;
    let rows = '';
    E.EXERCISES.forEach((e) => { rows += `<div>${esc(e.name)} <span class="muted tiny">(per ${E.isTimed(e.id) ? 'second' : e.unit.replace(/s$/, '')})</span></div>${inp('hardness.' + e.id, sc.hardness[e.id])}${inp('unitValue.' + e.id, sc.unitValue[e.id])}`; });
    return `<div class="card">${O.section('The points formula')}
        <div class="formula">Exercise points =<br>&nbsp; Hardness × Level ×<br>&nbsp; (Base + total × Unit value + minutes × Per-minute)<br><br>total = all reps of all sets, or all seconds for timed exercises (plank, jump rope)<br>minutes = timed exercises only<br><br>Day points = sum of all exercises<br>Day % = day points ÷ planned points</div>
        <p class="small">Example: Pull-ups, Level II, sets 10 · 8 · 6 →
          ${sc.hardness.PULL_UPS} × ${sc.levelMult[2]} × (${sc.base} + 24×${sc.unitValue.PULL_UPS}) = <b>${O.fmtNum(exPts)} pts</b></p>
        <p class="small">Example: Plank, Level II, 60 s + 45 s →
          ${sc.hardness.PLANK} × ${sc.levelMult[2]} × (${sc.base} + 105×${sc.unitValue.PLANK} + 1.75×${sc.perMinute}) = <b>${O.fmtNum(E.exercisePoints(exT, sc))} pts</b></p>
        <p class="muted small">Unit value = what one rep / second / length is worth compared with one pull-up rep. Points are stored when David closes a day, so changing the formula only affects new days.</p></div>
      <div class="card">${O.section('Exercises')}<div class="num-grid"><span></span><span class="h">Hardness</span><span class="h">Unit value</span>${rows}</div></div>
      <div class="card">${O.section('Levels & general')}<div class="num-grid">
        <div>Level I multiplier</div>${inp('levelMult.1', sc.levelMult[1])}<span></span>
        <div>Level II multiplier</div>${inp('levelMult.2', sc.levelMult[2])}<span></span>
        <div>Level III multiplier</div>${inp('levelMult.3', sc.levelMult[3])}<span></span>
        <div>Base points per exercise</div>${inp('base', sc.base, '1')}<span></span>
        <div>Points per minute</div>${inp('perMinute', sc.perMinute)}<span></span>
        <div>Skipped-day penalty</div>${inp('penalty', sc.penalty, '1')}<span></span>
        <div>"Completed" day at % of plan</div>${inp('completeAt', sc.completeAt, '1')}<span></span>
        <div>Monthly Trial of Heracles bonus</div>${inp('testBonus', sc.testBonus, '1')}<span></span>
      </div></div>
      <div class="row"><button class="btn-line grow" data-act="sc-reset" style="min-height:52px">Reset to defaults</button><div class="grow"><button class="btn-gold" data-act="sc-save">Save formula</button></div></div>`;
  }

  /* --------------------------------- media --------------------------------- */

  function slot(key, label, hint, kind = 'img') {
    const link = S.media.slots[key] || '';
    const file = kind === 'video' ? O.videoFile(key.replace(/^video_/, '')) : `media/${key}.png`;
    const url = kind === 'video' ? (link ? O.rawUrl(link) : file) : O.mediaURL(key);
    const thumb = kind === 'video'
      ? `<div class="thumb tall"><video src="${esc(url)}" muted playsinline preload="metadata" onerror="this.replaceWith(document.createTextNode('no video'))"></video></div>`
      : `<div class="thumb">${url ? `<img src="${esc(url)}" alt="">` : 'empty'}</div>`;
    return `<div class="slot">${thumb}<div class="meta"><b>${esc(label)}</b> <span class="muted tiny">${hint}</span><br>
      <span class="muted tiny">file: </span><code>${file}</code>
      <div class="row"><input id="m-${key}" value="${esc(link)}" placeholder="or paste a link (GitHub link is fine)"><button class="btn-text" data-act="media" data-key="${key}">Save</button>${link ? `<button class="btn-text danger-text" data-act="media-clear" data-key="${key}">✕</button>` : ''}</div></div></div>`;
  }

  function mediaTab() {
    const groups = [
      ['agora', 'Agora: the "Hail, David!" window (16:9)', () => slot('video_hero', 'Hail window video', '16:9 MP4 (plays silently, on a loop)', 'video')
        + slot('hero_bg', 'Hail window picture (used when there is no video)', '16:9 image or GIF, ~1280×720')
        + '<p class="muted small">Keep the lower half of the video calm: David\'s name, day and score are printed over it.</p>'],
      ['exercises', 'Exercise images (1:1)', () => E.EXERCISES.map((e) => [1, 2, 3].map((l) => slot(E.imgKey(e.id, l), `${e.name} · ${E.lvl(l).label}`, '1:1 PNG/JPG/WebP')).join('')).join('')],
      ['gifs', 'Exercise GIFs (1:1, used when there is no image)', () => E.EXERCISES.map((e) => [1, 2, 3].map((l) => slot(E.gifKey(e.id, l), `${e.name} · ${E.lvl(l).label}`, '1:1 GIF')).join('')).join('')],
      ['chronicle', 'Chronicle: month backgrounds and circles', () => E.UI_SLOTS.months.map(([k, l]) => slot(k, l, 'image or GIF, ~1080×1000')).join('')
        + E.UI_SLOTS.circles.map(([k, l]) => slot(k, l, '1:1 image or GIF (the day number is printed on top)')).join('')],
      ['codex', 'Codex (guide page) images', () => slot('guide_header', 'Codex banner', 'wide image or GIF, ~1080×600')
        + slot('guide_warmup', 'Warm-up picture (shown during the warm-up)', 'image or GIF, ~1080 wide')
        + E.GUIDE_SECTIONS.map(([id, t]) => slot('guide_' + id, 'Section · ' + t, 'any ratio, ~1080 wide')).join('')
        + '<p class="muted small">The Codex shows the exercise images from the "Exercise images" group for each level.</p>'],
      ['ranks', 'Ranks: frames around the avatar', () => E.RANKS.map((r) => slot('frame_' + r.id, `${E.roman(E.RANKS.indexOf(r) + 1)} · ${r.title} (from ${O.fmtNum(r.min)} Glory)`, 'wreath art, transparent')).join('')
        + '<p class="muted small">Each rank is a wreath drawn around David\'s round avatar. The 8 frame files are prepared so the avatar sits exactly in the wreath — to replace one, send the new art to Claude to fit it the same way.</p>'],
      ['nav', 'Navigation buttons', () => E.UI_SLOTS.nav.map(([k, l]) => slot(k, l, k === 'nav_bg' ? 'wide ~1080×240' : '1:1 transparent, 256×256')).join('')],
      ['hall', 'Hall of Glory', () => E.UI_SLOTS.hall.map(([k, l]) => slot(k, l, '9:16 image or GIF')).join('')
        + E.MEDALS.map((m) => slot('medal_' + m.id, 'Medal · ' + m.title, '1:1 image or GIF')).join('')
        + E.HORIZONS.map((h) => slot('coat_' + h.id.toLowerCase(), 'Coat of arms · ' + h.coat + ' (' + h.title + ')', '1:1 image or GIF')).join('')],
      ['videos', 'Celebration videos (9:16 MP4, ~10 s)', () => E.VIDEO_KEYS.map((k) => slot('video_' + k, k.replace(/_/g, ' ') + (k === 'day_incomplete' ? ' (optional: closed below 100% — else "day passed" plays)' : ''), '9:16 MP4', 'video')).join('')],
    ];
    let html = `<div class="card"><p class="small">Two ways to fill a slot:</p><p class="small">1) Upload a file with exactly the name shown into the <b>media</b> folder of your GitHub repo. For images, .png, .jpg, .webp and .gif all work.</p>
      <p class="small">2) Paste a direct link and tap Save. A link wins over a file.</p><p class="muted small">Empty slots show a labelled placeholder in David's app.</p></div>`;
    groups.forEach(([id, title, body]) => {
      const open = A.mediaOpen === id;
      html += `<div class="card"><div class="row" data-act="m-open" data-g="${id}" style="cursor:pointer"><div class="grow">${O.section(title)}</div><span>${open ? '▲' : '▼'}</span></div>${open ? body() : ''}</div>`;
    });
    return html;
  }

  /* --------------------------------- guide --------------------------------- */

  function guideTab() {
    const g = A.guideDraft || (A.guideDraft = { ...S.guide.texts });
    const area = (key, label, rows = 4) => `<label class="field"><span>${esc(label)}</span><textarea rows="${rows}" data-bind="guide" data-key="${key}" placeholder="${esc(O.guideText(key))}">${esc(g[key] || '')}</textarea></label>`;
    let html = `<div class="card"><p class="small">This is the text of David's <b>Codex</b> page. Leave a box empty to keep the default text, which is shown greyed out inside the box.
      Add pictures in <b>Media → Codex</b>. The exercise pictures come from <b>Media → Exercise images</b>.</p></div>`;
    html += `<div class="card">${O.section('Sections')}${E.GUIDE_SECTIONS.map(([id, t]) => area(id, t, 4)).join('')}</div>`;
    html += `<div class="card">${O.section('Warm-up')}<p class="muted small">One move per line, with its seconds at the end: "Jumping jacks — 45". David's Trial page counts them down one by one.</p>${area('warmup', 'Warm-up moves', 8)}</div>`;
    E.EXERCISES.forEach((x) => {
      html += `<div class="card">${O.section(x.name)}${[1, 2, 3].map((l) => area(E.guideExKey(x.id, l), `${E.lvl(l).label} — what it means`, 3)).join('')}${area('tips_' + x.id, 'Good form — one tip per line (shown under "How to do it")', 4)}</div>`;
    });
    return html + `<button class="btn-gold" data-act="guide-save">Save Codex text</button>`;
  }

  /* -------------------------------- settings -------------------------------- */

  function settingsTab() {
    if (A.davidReady === undefined && !A.davidLoading) {
      A.davidLoading = true;
      O.backend().davidState(S.user.uid).then((st) => { A.davidReady = !!st.ready; }).catch(() => { A.davidReady = false; }).finally(() => { A.davidLoading = false; render(); });
    }
    const p = O.profile();
    const st = A.settings || (A.settings = { name: p.name, start: p.startDate || S.today });
    return `<div class="card">${O.section('Athlete')}
        <label class="field"><span>Name</span><input data-bind="s-name" value="${esc(st.name)}"></label><button class="btn-text" data-act="s-name">Save name</button>
        <div class="row" style="margin-top:8px"><div class="grow">Journey start</div><button class="icon" data-act="s-start" data-d="-1">‹</button><b>${O.fmtDate(st.start)}</b><button class="icon" data-act="s-start" data-d="1">›</button></div>
        <p class="muted small">Changing the start re-checks skipped days from the new date. Days already closed or skipped keep their status.</p>
        <button class="btn-text" data-act="s-start-save" ${st.start === p.startDate ? 'disabled' : ''}>Save start date</button></div>
      <div class="card">${O.section("David's phone")}
        ${A.davidReady === undefined ? '<p class="muted small">Checking…</p>' : A.davidReady
          ? '<p class="small">David\'s code is set. Each phone needs it once. A new code signs out the phones paired with the old one.</p>'
          : '<p class="small bad">No code yet — David\'s app stays locked until you set one.</p>'}
        <div class="row"><input id="dc1" class="pin-box grow" type="password" inputmode="numeric" maxlength="8" placeholder="Code for David"><input id="dc2" class="pin-box grow" type="password" inputmode="numeric" maxlength="8" placeholder="Repeat"></div>
        <button class="btn-line" data-act="david-code" style="margin-top:8px">${A.davidReady ? 'Change the code' : 'Set the code'}</button></div>
      <div class="card">${O.section('Backup')}
        <p class="small">Download everything (days, medals, plans, targets, settings) as one file. Keep it safe — you can restore it any time.</p>
        <div class="row" style="flex-wrap:wrap;gap:8px"><button class="btn-line" data-act="backup">⬇ Download backup</button>
        <label class="btn-line file-btn">⬆ Restore from file<input type="file" accept="application/json,.json" data-change="restore" hidden></label></div>
        <p class="muted tiny">A backup is downloaded automatically before every reset.</p></div>
      <div class="card danger-zone">${O.section('Start again')}
        <p class="small">Deletes every closed day, skipped day, medal, coat of arms, monthly test and shop request, and sets points and streaks to 0. Quests can be won again. The journey starts again today.
        <b>Plans, quests, rewards, messages, targets, scoring, pictures, videos, the Codex, David's name and photo stay.</b></p>
        ${A.resetAsk ? `<p class="small">Type <b>RESET</b> to confirm:</p><input id="reset-word" autocomplete="off" style="text-transform:uppercase">
          <div class="row" style="margin-top:8px"><button class="btn-line grow" data-act="reset-cancel">Cancel</button><button class="btn-line danger grow" data-act="reset-go">Reset everything</button></div>`
        : `<button class="btn-line danger" data-act="reset-ask">Reset David's journey…</button>`}</div>
      <div class="card">${O.section('Admin PIN')}
        <p class="muted small">One PIN for all your devices. Changing it signs out your other devices until they enter the new PIN.</p>
        <div class="row"><input id="np1" class="pin-box grow" type="password" inputmode="numeric" maxlength="8" placeholder="New PIN"><input id="np2" class="pin-box grow" type="password" inputmode="numeric" maxlength="8" placeholder="Repeat"></div>
        <button class="btn-line" data-act="pin-change" style="margin-top:8px">Change PIN</button>
        <p style="margin-top:12px"><button class="btn-text" data-act="lock">🔒 Lock now</button> <button class="btn-text danger-text" data-act="forget">Forget this device</button></p></div>${O.versionHTML()}`;
  }

  /* --------------------------------- render --------------------------------- */

  let pending = false;
  const typing = () => { const a = document.activeElement; return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'); };

  function render() {
    if (!A.month) A.month = S.today.slice(0, 7);
    const app = document.getElementById('app');
    let body;
    if (!unlocked()) body = pinScreen();
    else if (!O.loaded()) body = `<div class="empty">${O.laurelSVG(100)}<p>Loading the chronicle…</p></div>`;
    else if (A.dayEdit) body = dayEditCard();
    else {
      const pend = S.requests.filter((r) => r.status === 'PENDING').length;
      const tabs = [['overview', 'Overview'], ['plans', 'Plans'], ['quests', 'Quests'], ['shop', pend ? `Shop (${pend})` : 'Shop'], ['insights', 'Insights'], ['targets', 'Targets'], ['scoring', 'Scoring'], ['media', 'Media'], ['guide', 'Guide'], ['settings', 'Settings']];
      const views = { overview, plans: plansTab, quests: questsTab, shop: shopTab, insights: insightsTab, targets: targetsTab, scoring: scoringTab, media: mediaTab, guide: guideTab, settings: settingsTab };
      body = `<div class="subtabs">${tabs.map(([k, l]) => `<button class="${A.sub === k ? 'on' : ''}" data-act="sub" data-sub="${k}">${l}</button>`).join('')}</div><div style="height:12px"></div>${views[A.sub]()}`;
    }
    app.innerHTML = topbar() + `<main style="padding-bottom:40px">${body}</main>`
      + (A.report && unlocked() && O.loaded() ? `<div class="print-wrap"><div class="print-bar no-print"><button class="btn-line" data-act="rp-close">Close</button><button class="btn-gold" data-act="rp-print">🖨 Print / Save as PDF</button></div>${O.reportHTML(A.reportMonth)}</div>` : '');
    document.body.classList.toggle('printing', !!A.report);
    pending = false;
  }
  function softRender() { if (typing()) pending = true; else render(); }
  document.addEventListener('focusout', () => setTimeout(() => { if (pending && !typing()) render(); }, 0));

  /* --------------------------------- events --------------------------------- */

  const val = (id) => (document.getElementById(id) || {}).value || '';
  const numOrBlank = (v) => { v = String(v).replace(',', '.').trim(); return v === '' || !Number.isFinite(+v) ? '' : +v; };

  document.addEventListener('input', (e) => {
    const el = e.target, d = el.dataset;
    if (!d.bind) return;
    if (d.bind === 'p-name') A.planDraft.name = el.value;
    else if (d.bind === 'd-note') dayRef(d.k).note = el.value;
    else if (d.bind === 'tg') A.targetDrafts[d.h][d.f] = el.value;
    else if (d.bind === 's-name') A.settings.name = el.value;
    else if (d.bind === 'de-reason') A.dayEdit.reason = el.value;
    else if (d.bind === 'guide') A.guideDraft[d.key] = el.value;
    else if (d.bind === 'q') A.questDraft[d.f] = d.f === 'title' ? el.value : el.value.replace(/[^0-9]/g, '');
    else if (d.bind === 'rw') A.rewardDraft[d.f] = d.f === 'cost' ? el.value.replace(/[^0-9]/g, '') : el.value;
    else if (d.bind === 'sc') {
      const [a, b] = d.path.split('.');
      const v = numOrBlank(el.value);
      if (b) A.scDraft[a][b] = v === '' ? 0 : v; else A.scDraft[a] = v === '' ? 0 : v;
    }
  });

  document.addEventListener('change', (e) => {
    const el = e.target, d = el.dataset;
    if (d.change === 'd-add' && el.value) {
      const day = dayRef(d.k);
      day.exercises = (day.exercises || []).concat([{ exercise: el.value, level: 1, targetPerSet: Array(E.isTimed(el.value) ? 2 : 3).fill(E.EX[el.value].dflt) }]);
      render();
    }
    if (d.change === 'de-add' && el.value) { A.dayEdit.entries.push({ exercise: el.value, level: 1, perSet: [E.EX[el.value].dflt] }); render(); }
    if (d.change === 'restore' && el.files && el.files[0]) restoreFrom(el.files[0]);
    if (d.change === 'q-kind') { A.questDraft.kind = el.value; render(); }
    if (d.change === 'q-ex') { A.questDraft.exercise = el.value; render(); }
    if (d.bind === 'sc') render(); // refresh the worked example
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.target.id === 'pin' || e.target.id === 'pin2')) document.querySelector('[data-act="pin-go"]')?.click();
  });

  document.addEventListener('click', async (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const d = el.dataset, be = O.backend();
    switch (d.act) {
      /* auth */
      case 'pin-go': {
        const pin = val('pin'), st = S.adminState;
        if (!/^\d{4,8}$/.test(pin)) { A.pinMsg = 'The PIN is 4–8 digits.'; break; }
        if (!st.ready && pin !== val('pin2')) { A.pinMsg = 'The two PINs are different.'; break; }
        A.busy = true; A.pinMsg = ''; render();
        const hash = await O.ADMIN.hash(pin);
        try {
          if (!st.ready) await be.createAdminPin(S.user.uid, hash);
          else if (st.registered && st.hash === hash) { /* known device, right PIN */ }
          else await be.registerAdmin(S.user.uid, hash); // the server says no if the PIN is wrong
          O.ADMIN.remember();
          await O.ADMIN.refresh();
        } catch (err) {
          A.pinMsg = /permission|denied|wrong/i.test(err.code || err.message) ? 'Wrong PIN.' : 'Could not check the PIN: ' + err.message;
        }
        A.busy = false; break;
      }
      case 'pin-change': {
        const p1 = val('np1'), p2 = val('np2');
        if (!/^\d{4,8}$/.test(p1)) return O.toast('The PIN is 4–8 digits');
        if (p1 !== p2) return O.toast('The two PINs are different');
        const hash = await O.ADMIN.hash(p1);
        if (await O.adminOp('PIN changed', () => be.changeAdminPin(S.user.uid, hash))) await O.ADMIN.refresh();
        break;
      }
      case 'reset-ask': A.resetAsk = true; break;
      case 'reset-cancel': A.resetAsk = false; break;
      case 'david-code': {
        const c1 = val('dc1'), c2 = val('dc2');
        if (!/^\d{4,8}$/.test(c1)) return O.toast('The code is 4–8 digits');
        if (c1 !== c2) return O.toast('The two codes are different');
        if (await O.adminOp('Code saved — give it to David', async () => be.setDavidCode(await O.davidCodeHash(c1)))) A.davidReady = true;
        break;
      }
      case 'backup': try { await O.backupNow(); O.toast('Backup downloaded'); } catch (err) { O.toast('Backup failed: ' + err.message); } return;
      case 'reset-go': {
        if (val('reset-word').trim().toUpperCase() !== 'RESET') return O.toast('Type RESET to confirm');
        try { await O.backupNow('before-reset'); } catch (err) { if (!confirm('The automatic backup failed (' + err.message + '). Reset anyway?')) return; }
        const p = O.profile();
        if (await O.adminOp('Journey reset — Day 1 starts today', () => be.resetJourney(S.today, { name: p.name || 'David', avatarPhoto: p.avatarPhoto || null }))) {
          A.resetAsk = false; A.settings = null;
        }
        break;
      }
      case 'lock': O.ADMIN.lock(); A.pinMsg = ''; break;
      case 'forget': if (!confirm('Forget this device? You will need the PIN to open the Admin here again.')) return;
        O.ADMIN.lock(); try { await be.forgetAdmin(S.user.uid); } catch (err) { console.warn(err); } await O.ADMIN.refresh(); break;

      /* navigation */
      case 'sub': A.sub = d.sub; A.settings = null; A.questDraft = null; A.report = false; A.targetDrafts = {}; A.scDraft = null; A.guideDraft = null; window.scrollTo(0, 0); break;
      case 'guide-save': {
        const texts = Object.fromEntries(Object.entries(A.guideDraft || {}).map(([k, v]) => [k, String(v || '').trim()]));
        await O.adminOp('Codex text saved', () => be.saveGuide(texts)); A.guideDraft = null; break;
      }
      case 'month': { const [y, m] = A.month.split('-').map(Number); A.month = new Date(Date.UTC(y, m - 1 + +d.dir, 1)).toISOString().slice(0, 7); break; }
      case 'metric': A.metric = d.metric; break;
      case 'day': openDayEdit(d.date); window.scrollTo(0, 0); break;
      case 'de-cancel': A.dayEdit = null; break;
      case 'de-rm': A.dayEdit.entries.splice(+d.i, 1); break;
      case 'de-lv': A.dayEdit.entries[+d.i].level = +d.lv; break;
      case 'de-save': case 'de-excuse': case 'de-lost': case 'de-reopen': case 'de-clear': {
        const de = A.dayEdit, date = de.date, log = S.logs[date], plan = O.planForDate(date);
        const entries = de.entries.filter((e) => E.isActive(e)).map((e) => ({ exercise: e.exercise, level: e.level, perSet: e.perSet, sets: e.perSet.length, minutes: Math.round(E.minutesOf(e) * 10) / 10 }));
        let rec, msg;
        if (d.act === 'de-save') { rec = O.adminDoneLog(date, entries); msg = 'Day saved — totals recalculated'; }
        if (d.act === 'de-excuse') { rec = { status: 'EXCUSED', entries, points: 0, reason: (de.reason || '').trim(), plan: plan || null, celebrated: true, excusedAt: Date.now() }; msg = 'Day excused — no penalty, streak safe'; }
        if (d.act === 'de-lost') { rec = { status: 'LOST', entries, points: -O.n0(S.scoring.penalty), planned: E.plannedPoints(plan, S.scoring), pct: 0, complete: false, plannedMinutes: E.plannedMinutes(plan), plan: plan || null, celebrated: true }; msg = 'Marked as skipped'; }
        if (d.act === 'de-reopen') { rec = { status: 'PENDING', entries: (log && log.entries) || [] }; msg = 'Reopened — David can log and close it again'; }
        if (d.act === 'de-clear') { if (!confirm('Remove the record of this day?')) return; rec = null; msg = 'Record removed — totals recalculated'; }
        if (await O.adminOp(msg, () => O.adminSaveDay(date, rec))) A.dayEdit = null;
        break;
      }

      /* plans */
      case 'plan-new': {
        A.planDraft = { id: '', name: 'Week plan', startDate: E.mondayOf(S.today), repeatWeeks: 4, days: Object.fromEntries(E.DOW.map((x) => [x, blankDay()])) };
        A.openDay = 'MONDAY'; window.scrollTo(0, 0); break;
      }
      case 'plan-edit': { const p = S.plans.find((x) => x.id === d.id); if (p) { A.planDraft = clone(p); A.openDay = 'MONDAY'; window.scrollTo(0, 0); } break; }
      case 'plan-del': {
        const p = S.plans.find((x) => x.id === d.id);
        if (p && confirm(`Delete "${p.name}"? Days already closed keep their record.`)) await O.adminOp('Plan deleted', () => be.deletePlan(d.id));
        break;
      }
      case 'plan-cancel': A.planDraft = null; break;
      case 'plan-save': {
        const p = { ...A.planDraft, name: (A.planDraft.name || '').trim() || 'Week plan', createdAt: Date.now() };
        E.DOW.forEach((x) => { const day = p.days[x]; if (day) day.targetMinutes = E.plannedMinutes(day); });
        if (await O.adminOp('Weekly plan saved', () => be.savePlan(p))) A.planDraft = null;
        break;
      }
      case 'p-start': A.planDraft.startDate = E.addDays(A.planDraft.startDate, +d.d); break;
      case 'p-weeks': A.planDraft.repeatWeeks = O.clamp(A.planDraft.repeatWeeks + +d.d, 1, 520); break;
      case 'p-copy': { const mon = clone(A.planDraft.days.MONDAY || blankDay()); E.DOW.forEach((x) => { A.planDraft.days[x] = clone(mon); }); O.toast('Monday copied to every day'); break; }
      case 'p-open': A.openDay = A.openDay === d.dow ? null : d.dow; break;
      case 'd-rm': dayRef(d.k).exercises.splice(+d.i, 1); break;
      case 'd-lv': dayRef(d.k).exercises[+d.i].level = +d.lv; break;
      case 'sl-step': case 'sl-del': case 'sl-add': {
        if (d.scope === 'day') { const e = A.dayEdit.entries[+d.row]; e.perSet = O.setsEdit(e.exercise, e.perSet, d.act, d); break; }
        const ex = dayRef(d.k).exercises[+d.row];
        ex.targetPerSet = O.setsEdit(ex.exercise, E.setList(E.planEntry(ex)), d.act, d);
        delete ex.targetReps; delete ex.targetSets; delete ex.targetMinutes; break;
      }

      /* targets */
      case 't-fill': {
        const src = d.src === 'plan' ? O.planTarget(d.h) : O.ghost(d.h);
        A.targetDrafts[d.h] = Object.fromEntries(TFIELDS.map(([k]) => [k, src[k] == null ? '' : src[k]]));
        break;
      }
      case 't-save': {
        const dr = A.targetDrafts[d.h];
        const t = { horizon: d.h, state: 'OFFICIAL' };
        TFIELDS.forEach(([k]) => { const v = numOrBlank(dr[k]); t[k] = k.startsWith('max') ? (v === '' ? null : v) : (v === '' ? 0 : v); });
        if (E.isEmptyTarget(t)) return O.toast('Fill in at least one value');
        await O.adminOp(`${E.HZ[d.h].title} target saved`, () => be.saveTarget(t)); delete A.targetDrafts[d.h]; break;
      }
      case 't-revert': await O.adminOp(`${E.HZ[d.h].title} target reset`, () => be.deleteTarget(d.h)); delete A.targetDrafts[d.h]; break;

      /* scoring */
      case 'sc-reset': A.scDraft = clone(E.DEFAULT_SCORING); O.toast('Defaults loaded — tap Save to keep them'); break;
      case 'sc-save': await O.adminOp('Formula saved', () => be.saveScoring(clone(A.scDraft))); A.scDraft = null; break;

      /* media */
      case 'm-open': A.mediaOpen = A.mediaOpen === d.g ? null : d.g; break;
      case 'media': await O.adminOp('Saved', () => be.setMedia(d.key, O.rawUrl(val('m-' + d.key)))); break;
      case 'media-clear': await O.adminOp('Link removed', () => be.setMedia(d.key, '')); break;

      /* settings */
      case 's-name': await O.adminOp('Name saved', () => be.updateProfile({ name: (A.settings.name || '').trim() || 'David' })); break;
      case 's-start': A.settings.start = E.addDays(A.settings.start, +d.d); break;
      case 's-start-save': await O.adminOp('Journey start saved', () => be.updateProfile({ startDate: A.settings.start, lastEvaluated: null })); break;

      /* v6: messages */
      case 'msg-send': {
        const text = val('msg-text').trim();
        if (!text) return O.toast('Write a message first');
        await O.adminOp('Message sent', () => be.saveDoc('messages', null, { text, at: Date.now(), from: 'council' }));
        break;
      }
      case 'msg-del': if (!confirm('Delete this message?')) return; await O.adminOp('Message deleted', () => be.deleteDoc('messages', d.id)); break;
      /* shop */
      case 'req-yes': await O.adminOp('Approved — enjoy!', () => be.patchDoc('requests', d.id, { status: 'APPROVED', decidedAt: Date.now() })); break;
      case 'req-no': {
        const note = prompt('Decline — a short reason for David (optional):', '');
        if (note === null) return;
        await O.adminOp('Declined — the Glory went back to his treasury', () => be.patchDoc('requests', d.id, { status: 'DECLINED', decidedAt: Date.now(), note: note.trim() }));
        break;
      }
      case 'rw-add': {
        const r = A.rewardDraft;
        if (!r.title.trim() || !O.n0(r.cost)) return O.toast('Give the reward a name and a price');
        if (await O.adminOp('Reward added', () => be.saveDoc('rewards', null, { emoji: r.emoji.trim() || '🎁', title: r.title.trim(), cost: O.n0(r.cost), note: r.note.trim(), active: true, createdAt: Date.now() }))) A.rewardDraft = null;
        break;
      }
      case 'rw-toggle': { const r = S.rewards.find((x) => x.id === d.id); if (r) await O.adminOp(r.active === false ? 'Shown in the shop' : 'Hidden from the shop', () => be.patchDoc('rewards', d.id, { active: r.active === false })); break; }
      case 'rw-del': if (!confirm('Delete this reward? Requests already made stay.')) return; await O.adminOp('Reward deleted', () => be.deleteDoc('rewards', d.id)); break;
      /* quests */
      case 'q-new': A.questDraft = newQuest(); window.scrollTo(0, 0); break;
      case 'q-tpl': A.questDraft = newQuest(QUEST_TEMPLATES[+d.i]); break;
      case 'q-edit': { const q = S.quests.find((x) => x.id === d.id); if (q) { A.questDraft = { ...q, days: E.diffDays(q.from, q.to) + 1 }; window.scrollTo(0, 0); } break; }
      case 'q-copy': {
        const q = S.quests.find((x) => x.id === d.id); if (!q) break;
        const len = E.diffDays(q.from, q.to) + 1, from = E.addDays(q.from, 7 * Math.max(1, Math.ceil(len / 7)));
        A.questDraft = { ...q, id: '', from: from < S.today ? S.today : from, days: len }; delete A.questDraft.claimedAt; delete A.questDraft.celebrated; window.scrollTo(0, 0); break;
      }
      case 'q-cancel': A.questDraft = null; break;
      case 'q-from': A.questDraft.from = E.addDays(A.questDraft.from, +d.d); break;
      case 'q-days': A.questDraft.days = O.clamp(O.n0(A.questDraft.days) + +d.d, 1, 92); break;
      case 'q-save': {
        const q = A.questDraft;
        if (!O.n0(q.goal)) return O.toast('Set a goal');
        const doc = { title: (q.title || '').trim(), kind: q.kind, goal: O.n0(q.goal), bonus: O.n0(q.bonus), from: q.from, to: E.addDays(q.from, Math.max(1, O.n0(q.days)) - 1), createdAt: q.createdAt || Date.now() };
        if (q.kind === 'reps') doc.exercise = q.exercise;
        if (q.claimedAt) { doc.claimedAt = q.claimedAt; doc.celebrated = true; }
        if (await O.adminOp('Quest saved', () => be.saveDoc('quests', q.id || null, doc))) {
          A.questDraft = null;
          if (doc.claimedAt && q.id) await O.adminRecompute({ quest: { id: q.id, bonus: doc.bonus } });
        }
        break;
      }
      case 'q-del': {
        const q = S.quests.find((x) => x.id === d.id);
        if (!q || !confirm(`Delete the quest "${q.title || E.questGoalText(q)}"?${q.claimedAt ? ' Its bonus is taken back from his Glory.' : ''}`)) return;
        if (await O.adminOp('Quest deleted', () => be.deleteDoc('quests', d.id)) && q.claimedAt) await O.adminRecompute({ quest: { id: q.id, bonus: null } });
        break;
      }
      /* insights */
      case 'prog-dismiss': localStorage.setItem('olympus_prog_dismissed', JSON.stringify(dismissed().concat([d.key]).slice(-50))); break;
      case 'prog-apply': {
        const sg = E.progressionSuggestions(S.today, S.logs, O.planForDate).find((x) => x.key === d.key);
        if (!sg) break;
        const touched = S.plans.filter((p) => E.planEnd(p) > S.today && E.DOW.some((x) => ((p.days[x] || {}).exercises || []).some((y) => y.exercise === sg.exercise)));
        if (!touched.length) return O.toast('No current plan has this exercise');
        if (!confirm(`Change ${E.EX[sg.exercise].name} in ${touched.length} plan(s)? Every day with this exercise gets the new numbers.`)) return;
        const delta = sg.to[0] - sg.from[0];
        await O.adminOp('Plan updated — David sees it on his next day', async () => {
          for (const p of touched) {
            const c = clone(p);
            E.DOW.forEach((x) => ((c.days[x] || {}).exercises || []).forEach((y) => {
              if (y.exercise !== sg.exercise) return;
              const cur = E.setList(E.planEntry(y));
              y.targetPerSet = sg.newLevel !== sg.level ? sg.to.slice() : cur.map((v) => v + delta);
              y.level = sg.newLevel; delete y.targetReps; delete y.targetSets;
            }));
            E.DOW.forEach((x) => { if (c.days[x]) c.days[x].targetMinutes = E.plannedMinutes(c.days[x]); });
            await be.savePlan(c);
          }
        });
        break;
      }
      case 'test-del': {
        const t = S.tests.find((x) => x.id === d.id);
        if (!t || !confirm(`Remove the Trial of ${t.id}? Its bonus is taken back.`)) return;
        if (await O.adminOp('Test removed', () => be.deleteDoc('tests', d.id))) await O.adminRecompute({ test: { id: t.id, bonus: null } });
        break;
      }
      case 'rp-month': { const [y, m] = A.reportMonth.split('-').map(Number); A.reportMonth = new Date(Date.UTC(y, m - 1 + +d.dir, 1)).toISOString().slice(0, 7); break; }
      case 'rp-open': A.report = true; window.scrollTo(0, 0); break;
      case 'rp-close': A.report = false; break;
      case 'rp-print': window.print(); return;
      case 'demo-next': case 'demo-today': case 'demo-wipe': O.demoAction(d.act); return;
      default: return;
    }
    render();
  });

  /** Restore a backup file over the current journey. */
  async function restoreFrom(file) {
    let data;
    try { data = JSON.parse(await file.text()); } catch (e) { return O.toast('This is not a backup file'); }
    if (!data || data.app !== 'path-to-olympus') return O.toast('This is not a Path to Olympus backup');
    if (!confirm(`Restore the backup from ${String(data.exportedAt || '').slice(0, 10)}? Everything now in the app is replaced by it.`)) return;
    try { await O.backupNow('before-restore'); } catch (e) { /* continue */ }
    await O.adminOp('Backup restored', () => O.backend().importAll(data));
    render();
  }

  /** Open when this device has proved the PIN and was not locked. */
  const unlocked = () => !!(S.user && S.isAdmin && O.ADMIN.remembered());

  O.onChange(softRender);
  render();
  O.start('admin');

  O.watchUpdates();
})();
</script>
</body>
</html>
