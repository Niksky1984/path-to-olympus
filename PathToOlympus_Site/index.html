<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5E3815">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Path to Olympus</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>

<script src="config.js"></script>
<script src="engine.js"></script>
<script src="core.js"></script>
<script src="fx.js"></script>
<script>
/* =============================================================================
 * David's app: Agora (home) · Trial (today's log) · Chronicle · Hall · Avatar
 * ========================================================================== */
(function () {
  'use strict';
  const O = window.Olympus, E = O.E, S = O.S, esc = O.esc;

  const V = {
    tab: 'home',            // home | trial | chronicle | hall | avatar
    month: S.today.slice(0, 7),
    metric: 'POINTS',
    edit: null,           // { exId, isNew, draft: {level, reps, sets, minutes} } — the exercise pop-up
    pick: false,          // "add another exercise" chooser
    confirmClose: false,  // close-the-day confirmation
    photoDraft: undefined,  // undefined = unchanged, null = remove, string = new photo
    intro: null,            // first-time walkthrough step (0–3) or null
    timer: null,            // { i, t0 } — a timed set being measured
    rest: null,             // { end, total } — rest countdown between sets
    pairMsg: '',
    warm: null,             // { i, end } — guided warm-up in progress
    shopAsk: null,          // reward id waiting for "yes, ask"
    test: null,             // { results:{}, clock:{ id, mode, t0, end } } — the monthly Trial being entered
  };
  const SUBPAGES = ['avatar', 'shop', 'test', 'settings'];

  /* ------------------------------- shell ------------------------------- */

  function topbar() {
    const back = SUBPAGES.includes(V.tab);
    return `<header class="topbar"><div class="in">
      ${back ? '<button class="back" data-act="tab" data-tab="home" aria-label="Back">‹</button>' : O.laurelSVG(34, O.C.gold)}
      <div class="grow"><h1>PATH TO OLYMPUS</h1><div class="motto">${O.MOTTO}</div></div>
      ${avatarBtn()}
    </div><div class="meander"></div></header>${O.demoBarHTML()}${O.syncHTML()}${S.error ? `<div class="error-bar">${esc(S.error)}</div>` : ''}`;
  }

  /**
   * The avatar in its rank wreath. It is a little taller than the top bar: the wreath hangs over the
   * bar's lower edge (the avatar's lightning aura is drawn around it by fx.js).
   */
  function avatarBtn() {
    const D = Math.round(Math.min(150, Math.max(112, innerWidth * 0.31)));
    if (!O.loaded()) return `<button class="avatar-btn" data-act="tab" data-tab="avatar" aria-label="Change avatar">${O.avatarHTML(O.profile(), D)}</button>`;
    return `<button class="avatar-btn big" data-act="tab" data-tab="avatar" aria-label="Change avatar" style="width:${Math.round(D * 1.3)}px;height:${Math.round(D * 0.78)}px">
      <span class="av-hang">${O.rankFrameHTML(O.rank().idx, D)}</span></button>`;
  }

  /* Engraved gold icons for the medallions (replaced by media/nav_*.png when present). */
  const G = '#E9D27F', GD = '#5E3815';
  const NAV_ICONS = {
    home: `<svg viewBox="0 0 32 32"><path fill="${G}" d="M16 3 3 10h26z"/><rect fill="${G}" x="4" y="11" width="24" height="2.5"/><g fill="${G}"><rect x="6" y="14.5" width="3" height="10"/><rect x="11.5" y="14.5" width="3" height="10"/><rect x="17.5" y="14.5" width="3" height="10"/><rect x="23" y="14.5" width="3" height="10"/></g><rect fill="${G}" x="3" y="25.5" width="26" height="3"/></svg>`,
    trial: `<svg viewBox="0 0 32 32"><path fill="${G}" d="M16 2c-6 0-10 4-10 10v6c0 3 1 5 3 7l2 4h3l-1-6c-1-1-2-2-2-4v-3h10v3c0 2-1 3-2 4l-1 6h3l2-4c2-2 3-4 3-7v-6C26 6 22 2 16 2z"/><path fill="${GD}" d="M9 12h5v4H9zM18 12h5v4h-5zM15 12h2v9h-2z"/><path fill="#B0302A" d="M10 1h12l-2 3h-8z"/></svg>`,
    chronicle: `<svg viewBox="0 0 32 32"><rect fill="${G}" x="7" y="5" width="18" height="22" rx="1"/><circle fill="${G}" cx="7" cy="7" r="3"/><circle fill="${G}" cx="25" cy="25" r="3"/><g stroke="${GD}" stroke-width="1.6"><line x1="11" y1="11" x2="21" y2="11"/><line x1="11" y1="15" x2="21" y2="15"/><line x1="11" y1="19" x2="18" y2="19"/></g></svg>`,
    codex: `<svg viewBox="0 0 32 32"><path fill="${G}" d="M4 6c4-1.5 8-1.5 11 1v19c-3-2.5-7-2.5-11-1z"/><path fill="${G}" d="M28 6c-4-1.5-8-1.5-11 1v19c3-2.5 7-2.5 11-1z"/><g stroke="${GD}" stroke-width="1.2"><line x1="7" y1="11" x2="12.5" y2="11.6"/><line x1="7" y1="15" x2="12.5" y2="15.6"/><line x1="19.5" y1="11.6" x2="25" y2="11"/><line x1="19.5" y1="15.6" x2="25" y2="15"/></g></svg>`,
    hall: `<svg viewBox="0 0 32 32"><path fill="${G}" d="M9 4h14v6c0 4-3 7-7 7s-7-3-7-7z"/><path fill="none" stroke="${G}" stroke-width="2" d="M9 7H5c0 4 2 6 5 6M23 7h4c0 4-2 6-5 6"/><rect fill="${G}" x="14.5" y="17" width="3" height="6"/><path fill="${G}" d="M10 23h12l1 5H9z"/></svg>`,
  };

  function nav() {
    const bg = O.mediaURL('nav_bg');
    const t = (id, label) => {
      const img = O.mediaURL('nav_' + id);
      return `<button class="${V.tab === id ? 'on' : ''} ${img ? 'has-img' : ''}" data-act="tab" data-tab="${id}" aria-label="${label}">
        <span class="medallion ${img ? 'has-img' : ''}">${img ? `<img src="${esc(img)}" alt="">` : NAV_ICONS[id]}</span><span class="lbl">${label}</span></button>`;
    };
    return `<nav class="tabs ${bg ? 'custom-bg' : ''}"${bg ? ` style="background-image:url('${esc(bg)}')"` : ''}>${t('home', 'Agora')}${t('trial', 'Trial')}${t('chronicle', 'Chronicle')}${t('hall', 'Hall')}${t('codex', 'Codex')}</nav>`;
  }

  /* -------------------------------- home -------------------------------- */

  function home() {
    const p = O.profile();
    const dayNo = E.diffDays(O.startDate(), S.today) + 1;
    const st = O.todayStats(), closed = O.todayClosed(), log = O.todayLog();
    const dailyText = closed ? `Closed · ${O.n0(log.pct)}% · +${O.fmtNum(log.points)} pts`
      : st.planned || st.points ? `${O.fmtNum(st.points)} / ${O.fmtNum(st.planned)} pts · ${st.pct}%` : 'No plan today';
    const wk = O.week();
    // the "Hail" window: David's own 16:9 video (media/video_hero.mp4), else a 16:9 picture (hero_bg), else the bronze card
    const vid = heroVideoReady(), pic = vid ? null : O.mediaURL('hero_bg');
    let html = `<section class="hero ${vid || pic ? 'has-media' : ''}">
      ${vid || pic ? `<div class="hero-media" id="hero-media">${pic ? `<img src="${esc(pic)}" alt="">` : ''}</div><div class="hero-shade"></div>` : O.laurelSVG(140, O.C.gold, 0.25)}
      <div class="hero-txt"><h2>Hail, ${esc(p.name)}!</h2><div class="sub">Day ${dayNo.toLocaleString()} of 3,652 on the Path to Olympus</div>
      <div class="nums"><div><div class="eyebrow">GLORY ${O.rankLineHTML()}</div><div class="score">${O.fmtNum(p.score)}</div></div>
      <div class="streak">🔥 <b>${O.n0(p.currentStreak)}</b><small>day streak · best ${O.n0(p.bestStreak)}</small></div></div></div></section>`;
    html += O.messageCard();
    html += `<div class="card">${O.section('Progress')}${O.labeled('Today', dailyText, closed ? Math.min(1, O.n0(log.pct) / 100) : st.planned ? st.points / st.planned : 0)}${O.labeled('This week', `${wk.done} / ${wk.planned} days closed`, wk.planned ? wk.done / wk.planned : 0)}</div>`;

    const plan = O.todayPlan();
    html += `<div class="card">${O.section("Today's plan · " + O.fmtDate(S.today, 'day'))}`;
    if (!plan || E.isRest(plan)) {
      html += `<p class="muted">${plan ? 'Rest day in the plan' : 'No plan for today'} — but you can still train and close the day.</p>`;
    } else {
      html += `<h3 style="font-size:17px">${O.fmtNum(st.planned)} points${st.plannedMinutes ? ` · ${st.plannedMinutes} min timed` : ''}</h3>${plan.note ? `<p class="muted small">${esc(plan.note)}</p>` : ''}`;
      plan.exercises.forEach((ex) => {
        const info = E.EX[ex.exercise];
        const done = O.todayEntries().find((e) => e.exercise === ex.exercise && E.isActive(e));
        html += `<div class="ex-row"><span class="check ${done ? 'on' : ''}">✓</span><div class="grow"><div>${esc(info.name)}</div>
          <div class="muted small">${esc(E.fmtSets(E.planEntry(ex)))}</div></div>${O.levelBadge(ex.level)}</div>`;
      });
    }
    html += `<div style="margin-top:12px"><button class="btn-gold" data-act="tab" data-tab="trial">${closed ? 'Day closed — see you tomorrow' : "Log today's training"}</button></div></div>`;
    html += O.questsCard() + (O.thisTest() ? '' : O.testHomeCard()) + O.treasuryCard();
    return html + `${O.homeGoalsCard()}<p class="motto-line">“${O.MOTTO}”</p>${O.versionHTML()}`;
  }

  /* The hero video is checked once, then one <video> element is kept and moved into every
     re-render, so it keeps playing instead of restarting each time something changes. */
  const HERO = { state: 'unknown', el: null };
  function heroVideoReady() {
    if (HERO.state === 'unknown') {
      HERO.state = 'checking';
      if (S.media.slots.video_hero) { HERO.state = 'yes'; return true; }
      fetch(O.videoURL('hero'), { method: 'HEAD', cache: 'no-store' })
        .then((r) => { HERO.state = r.ok ? 'yes' : 'no'; if (r.ok) render(); })
        .catch(() => { HERO.state = 'no'; });
    }
    return HERO.state === 'yes';
  }
  function mountHeroVideo() {
    const slot = document.getElementById('hero-media');
    if (!slot || HERO.state !== 'yes') return;
    if (!HERO.el) {
      const v = document.createElement('video');
      Object.assign(v, { muted: true, loop: true, autoplay: true, playsInline: true, preload: 'auto' });
      v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
      v.onerror = () => { HERO.state = 'no'; HERO.el = null; render(); };
      v.src = O.videoURL('hero');
      HERO.el = v;
    }
    slot.appendChild(HERO.el);
    if (HERO.el.paused) HERO.el.play().catch(() => {});
  }

  /* -------------------------------- trial -------------------------------- */

  /** One square per exercise: the plan first, then anything extra David added. */
  function tile(row, closed) {
    const p = row.planned, e = row.entry;
    const exId = p ? p.exercise : e.exercise;
    const info = E.EX[exId];
    const level = e ? e.level : p.level;
    const active = E.isActive(e);
    const img = O.exerciseMediaURL(exId, level);
    const sub = active ? `${O.fmtNum(E.exercisePoints(e, S.scoring))} pts<br>${esc(E.fmtSets(e))}`
      : p ? E.fmtSets(E.planEntry(p)) : 'not logged';
    return `<button class="tile ${active ? 'done' : ''} ${p ? '' : 'extra'}" data-act="open-ex" data-ex="${exId}" ${closed ? 'disabled' : ''}>
      ${img ? `<img src="${esc(img)}" alt="">` : `<span class="t-emblem">${O.laurelSVG(64, O.C.gold, 0.7)}</span>`}<span class="shade"></span>
      <span class="t-lvl">${p ? E.lvl(level).roman : '+ ' + E.lvl(level).roman}</span><span class="t-ok">✓</span>
      <span class="t-name">${esc(info.name)}</span><span class="t-sub">${sub}</span></button>`;
  }

  function trial() {
    const plan = O.todayPlan();
    const closed = O.todayClosed();
    const st = O.todayStats();
    const rows = O.todayRows();
    const log = O.todayLog();
    let html = `<div class="card"><h2 style="font-size:20px">${O.fmtDate(S.today, 'long')}</h2>
      ${plan && plan.note ? `<p class="muted">${esc(plan.note)}</p>` : ''}
      <p class="small muted">${closed ? '' : !plan || E.isRest(plan) ? 'No exercises planned today — anything you do still counts. Tap + to add one.' : 'Tap an exercise, enter what you did and press OK. You can change it until you close the day.'}</p>
      ${closed ? (log.status === 'EXCUSED' ? `<p class="muted"><b>Excused by the Council</b> — rest and recover. Your streak is safe.</p>` : `<p class="ok">Day closed · ${O.n0(log.pct)}% · +${O.fmtNum(log.points)} points. The log is locked.</p>`) : ''}</div>`;
    if (!closed) {
      const moves = E.parseWarmup(O.guideText('warmup'));
      const mins = Math.max(1, Math.round(moves.reduce((a, x) => a + x.secs, 0) / 60));
      html += `<div class="card warm-card"><div class="row"><div class="grow"><b>Warm up first · ${mins} min</b><div class="muted small">${moves.length} moves, the app counts the time for you.</div></div>
        <button class="btn-line" data-act="warm-start">▶ Start</button></div></div>`;
    }
    html += `<div class="tiles">${rows.map((r) => tile(r, closed)).join('')}${closed ? '' : '<button class="tile add" data-act="pick"><b>+</b><span>OTHER</span></button>'}</div>`;
    const bar = st.planned ? st.points / st.planned : st.points ? 1 : 0;
    html += `<div class="card">${O.labeled(st.planned ? 'Points vs plan' : 'Points', st.planned ? `${O.fmtNum(st.points)} / ${O.fmtNum(st.planned)} · ${st.pct}%` : `${O.fmtNum(st.points)} pts`, bar)}
      <div class="muted small" style="margin:-4px 0 10px">${st.minutes || st.plannedMinutes ? `Timed ${st.minutes} / ${st.plannedMinutes} min · ` : ''}${st.exercisesDone} exercise(s) logged</div>
      ${closed ? '' : `<button class="btn-gold" data-act="close-day" ${st.canClose ? '' : 'disabled'}>Close the day</button>
      ${st.canClose ? '' : '<p class="muted small center">Log at least one exercise to close the day.</p>'}`}</div>`;
    return html + `<p class="motto-line">“${O.MOTTO}”</p>`;
  }

  /* ------------------------------ pop-ups ------------------------------ */

  function openEditor(exId) {
    const row = O.todayRows().find((r) => (r.planned ? r.planned.exercise : r.entry.exercise) === exId);
    const p = row && row.planned, e = row && row.entry;
    // start from what was logged; otherwise from the plan (just tap OK if done as planned); extras get one set
    const list = E.isActive(e) ? E.setList(e) : p ? E.setList(E.planEntry(p)) : [E.EX[exId].dflt];
    V.edit = { exId, isNew: !row, isExtra: !p, draft: { level: (e && e.level) || (p && p.level) || 1, perSet: list } };
  }

  function editorSheet() {
    const ed = V.edit, info = E.EX[ed.exId], d = ed.draft;
    const plan = O.todayPlan();
    const p = plan && (plan.exercises || []).find((x) => x.exercise === ed.exId);
    const entry = { exercise: ed.exId, ...d };
    const pts = E.exercisePoints(entry, S.scoring);
    return `<div class="sheet-wrap" data-act="sheet-bg"><div class="sheet">
      <div class="row"><h3 class="grow">${esc(info.name)}</h3>${p ? O.levelBadge(p.level) : '<span class="extra-tag">EXTRA</span>'}</div>
      ${O.exerciseMediaHTML(ed.exId, d.level)}
      <p class="small">${esc(O.guideText(E.guideExKey(ed.exId, d.level)))} <button class="btn-text howto-btn" data-act="howto" data-ex="${ed.exId}" data-lv="${d.level}">❔ How to do it</button></p>
      ${p ? `<div class="ex-plan">Plan: ${E.lvl(p.level).label} · ${esc(E.fmtSets(E.planEntry(p)))}</div>` : ''}
      <div class="small muted" style="margin-top:10px">Level performed</div>
      <div class="levels" style="margin-top:4px">${[1, 2, 3].map((n) => `<button class="${d.level === n ? 'on' : ''}" data-act="ed-lv" data-lv="${n}">${E.lvl(n).roman}</button>`).join('')}</div>
      <div class="small muted" style="margin-top:12px">${E.isTimed(ed.exId) ? 'Time held in each set' : 'Reps in each set'}</div>
      ${O.setsEditorHTML(ed.exId, d.perSet, '', { timer: E.isTimed(ed.exId), running: V.timer ? V.timer.i : -1 })}
      ${timerBar()}
      <div class="row small"><span class="grow muted">Total: ${E.isActive(entry) ? (E.isTimed(ed.exId) ? E.fmtSecs(E.volume(entry)) : `${O.fmtNum(E.volume(entry))} ${info.unit}`) + ` in ${E.setsOf(entry)} set(s)` : '—'}</span><span class="ex-pts">${O.fmtNum(pts)} pts</span></div>
      ${!ed.isNew && ed.isExtra ? '<button class="btn-text danger-text" data-act="ed-remove">Remove from today</button>' : ''}
      ${!ed.isNew && !ed.isExtra ? '<button class="btn-text danger-text" data-act="ed-clear">Clear</button>' : ''}
      <div class="btns"><button class="btn-line" data-act="ed-cancel">Cancel</button><button class="btn-gold" data-act="ed-ok">OK</button></div>
    </div></div>`;
  }

  function pickSheet() {
    const rows = O.todayRows();
    const left = E.EXERCISES.filter((x) => !rows.some((r) => (r.planned ? r.planned.exercise : r.entry.exercise) === x.id));
    return `<div class="sheet-wrap" data-act="sheet-bg"><div class="sheet"><h3>Did something else?</h3>
      <p class="muted small">Choose the exercise you did.</p>
      <div class="pick-list">${left.map((x) => `<button data-act="pick-ex" data-ex="${x.id}">${esc(x.name)}</button>`).join('') || '<p class="muted">All exercises are already on today\'s list.</p>'}</div>
      <div class="btns" style="grid-template-columns:1fr"><button class="btn-line" data-act="sheet-close">Cancel</button></div></div></div>`;
  }

  function confirmSheet() {
    const st = O.todayStats();
    const items = O.todayRows().filter((r) => E.isActive(r.entry)).map((r) => {
      const e = r.entry, info = E.EX[e.exercise];
      return `<div><span>${esc(info.name)} · ${E.lvl(e.level).roman} · ${esc(E.fmtSets(e))}</span><b>${O.fmtNum(E.exercisePoints(e, S.scoring))}</b></div>`;
    }).join('');
    const verdict = st.complete ? '<p class="ok">This will be a COMPLETED day ✓</p>'
      : `<p class="warn">This will be an INCOMPLETE day (${st.pct}% — ${S.scoring.completeAt}% needed to complete it). Your streak continues.</p>`;
    return `<div class="sheet-wrap" data-act="sheet-bg"><div class="sheet"><h3>Close the day?</h3>
      <p class="muted small">After closing, today's log is locked and can't be changed.</p>
      <div class="confirm-list">${items}</div>
      <p class="strong">${O.fmtNum(st.points)} points${st.planned ? ` of ${O.fmtNum(st.planned)} planned · ${st.pct}%` : ''}${st.minutes ? ` · ${st.minutes} min timed` : ''}</p>${verdict}
      <div class="btns"><button class="btn-line" data-act="sheet-close">Go back</button><button class="btn-gold" data-act="close-confirm">Yes, close it</button></div></div></div>`;
  }

  /* -------------------------------- codex -------------------------------- */

  function codex() {
    const sec = (id, title) => {
      const img = O.mediaURL('guide_' + id);
      return `<div class="card codex" id="codex-${id}"><h3>${esc(title)}</h3>${img ? `<img class="sec-img" src="${esc(img)}" alt="">` : ''}<p>${esc(O.guideText(id))}</p></div>`;
    };
    const header = O.mediaURL('guide_header');
    let html = `<div class="codex-hero">${header ? `<img class="banner" src="${esc(header)}" alt="">` : O.laurelSVG(110)}<h2>The Codex of Olympus</h2>
      <p class="muted">Everything you need to know about the road.</p>
      <div class="toc">${E.GUIDE_SECTIONS.map(([id, t]) => `<button class="chip" data-act="goto" data-id="codex-${id}">${esc(t)}</button>`).join('')}<button class="chip" data-act="goto" data-id="codex-exercises">The eight exercises</button></div></div>`;
    E.GUIDE_SECTIONS.forEach(([id, t]) => { html += sec(id, t); });
    html += `<h2 id="codex-exercises" class="center" style="margin:18px 0 10px">The eight exercises</h2>`;
    E.EXERCISES.forEach((x) => {
      html += `<div class="card codex"><h3>${esc(x.name)}</h3><div class="muted small">${esc(x.focus)} · counted in ${x.unit}</div>`;
      [1, 2, 3].forEach((l) => {
        const img = O.exerciseMediaURL(x.id, l);
        html += `<div class="lvl-block"><div class="pic">${img ? `<img src="${esc(img)}" alt="">` : `<span>${E.lvl(l).roman}</span>`}</div>
          <div><b>${E.lvl(l).label}</b><p>${esc(O.guideText(E.guideExKey(x.id, l)))}</p></div></div>`;
      });
      html += '</div>';
    });
    return html + `<div class="center" style="margin:10px 0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn-line" data-act="intro-replay">Replay the introduction</button><button class="btn-line" data-act="tab" data-tab="settings">⚙ Settings</button></div><p class="motto-line">“${O.MOTTO}”</p>${O.versionHTML()}`;
  }

  /* ------------------------------ chronicle ------------------------------ */

  const chronicle = () => O.calendarCard(V.month) + O.totalsCard() + O.recordsCard() + O.testsCard() + O.trendsCard(V.metric) + O.trajectoryCard() + O.horizonsCard();

  /* -------------------------------- hall -------------------------------- */

  function hall() {
    const earned = Object.fromEntries(S.awards.map((a) => [a.id, a]));
    let html = `<div class="hall-head"><div class="wreath">${O.laurelSVG(150)}<b>${S.awards.length}</b></div>
      <h2>Hall of Glory</h2><p class="muted">Every medal is a step of the road you walked yourself.</p></div>`;
    html += O.ranksCard();
    html += `<div class="card">${O.section('Medals')}<div class="medals">`;
    E.MEDALS.forEach((m, i) => {
      const got = earned[m.id];
      html += `<div class="medal-tile ${got ? '' : 'locked'}">${O.awardArt('MEDAL', m.id, !!got, 84, i)}<h4>${esc(m.title)}</h4><small>${got ? 'Earned ' + O.fmtMillis(got.earnedAt) : esc(m.subtitle)}</small></div>`;
    });
    html += `</div></div><div class="card">${O.section('Coats of arms')}`;
    E.HORIZONS.forEach((h) => {
      const mine = S.awards.filter((a) => a.horizon === h.id);
      const t = O.target(h.id), b = O.currentBlock(h.id), ghost = t.state === 'GHOST';
      html += `<div class="coat-row">${O.awardArt('COAT_OF_ARMS', h.id, mine.length > 0, 72)}<div class="grow">
        <h4>${esc(h.coat)}</h4><div class="muted small">${mine.length ? `Earned ×${mine.length} · latest ${esc(mine[mine.length - 1].title)}` : `${h.title} target · not yet earned`}</div>
        ${O.bar(E.progress(t, b.tot), ghost, 'thin')}
        <div class="muted" style="font-size:11px">${h.repeats ? `${h.title} ${E.roman(b.idx + 1)} in progress` : 'In progress'}${ghost ? ' · ghost target, awaiting calibration' : ''}</div></div></div>`;
    });
    return html + `</div><p class="motto-line">“${O.MOTTO}”</p>`;
  }

  /* ------------------------------- avatar ------------------------------- */

  function avatar() {
    const p = O.profile();
    const shown = V.photoDraft === undefined ? p : { ...p, avatarPhoto: V.photoDraft };
    const changed = V.photoDraft !== undefined;
    return `<div class="card"><div class="avatar-edit">
        <h2>Your hero</h2>
        ${O.avatarHTML(shown, 200)}
        <p class="muted small center">Choose any picture from your phone. It is cropped to a circle and shown in the top-right corner.</p>
        <label class="btn-line file-btn">📷 Choose a picture<input type="file" accept="image/*" data-change="photo"></label>
        ${shown.avatarPhoto ? '<button class="btn-text danger-text" data-act="photo-remove">Remove picture</button>' : ''}
      </div></div>
      <button class="btn-gold" data-act="save-avatar" ${changed ? '' : 'disabled'}>Save avatar</button>
      <div class="center" style="margin-top:14px"><button class="btn-line" data-act="tab" data-tab="settings">⚙ Settings</button></div>`;
  }

  /* -------------------------------- shop -------------------------------- */

  function shop() {
    const t = O.treasury();
    const rewards = S.rewards.filter((r) => r.active !== false);
    let html = `<div class="card center treasury-head"><div class="eyebrow-dark">YOUR TREASURY</div><div class="t-big">◎ ${O.fmtNum(t)}</div>
      <p class="muted small">Glory you can spend. Your Glory score and rank never go down when you buy — only the treasury does.</p></div>`;
    html += `<div class="card">${O.section('Rewards')}`;
    html += rewards.length ? rewards.map((r) => {
      const can = t >= O.n0(r.cost), short = O.n0(r.cost) - t;
      return `<div class="reward ${can ? '' : 'locked'}"><span class="rw-emoji">${esc(r.emoji || '🎁')}</span><div class="grow"><b>${esc(r.title)}</b>${r.note ? `<div class="muted small">${esc(r.note)}</div>` : ''}
        <div class="rw-cost">◎ ${O.fmtNum(r.cost)}</div>${can ? '' : O.bar(t / Math.max(1, O.n0(r.cost)), false, 'thin') + `<div class="muted tiny">${O.fmtNum(short)} more to go</div>`}</div>
        <button class="btn-line" data-act="shop-ask" data-id="${r.id}" ${can ? '' : 'disabled'}>Ask</button></div>`;
    }).join('') : '<p class="muted">The Council has not added rewards yet.</p>';
    html += '</div>';
    if (S.requests.length) {
      const label = { PENDING: '⏳ waiting', APPROVED: '✅ approved', DECLINED: '✕ declined' };
      html += `<div class="card">${O.section('Your requests')}${S.requests.map((q) => `<div class="req ${q.status.toLowerCase()}"><span>${esc(q.emoji || '🎁')}</span><div class="grow"><b>${esc(q.title)}</b>
        <div class="muted tiny">${O.fmtMillis(q.at)} · ◎ ${O.fmtNum(q.cost)}${q.note ? ' · ' + esc(q.note) : ''}</div></div><span class="req-st">${label[q.status] || q.status}</span>
        ${q.status === 'PENDING' ? `<button class="btn-text danger-text" data-act="req-cancel" data-id="${q.id}">Cancel</button>` : ''}</div>`).join('')}</div>`;
    }
    return html;
  }
  function shopSheet() {
    const r = S.rewards.find((x) => x.id === V.shopAsk);
    if (!r) { V.shopAsk = null; return ''; }
    return `<div class="sheet-wrap" data-act="sheet-bg"><div class="sheet center"><div class="rw-emoji big">${esc(r.emoji || '🎁')}</div><h3>${esc(r.title)}</h3>
      <p>Ask the Council for this reward? <b>◎ ${O.fmtNum(r.cost)}</b> Glory is kept aside until they decide. If they say no, you get it back.</p>
      <div class="btns"><button class="btn-line" data-act="sheet-close">Not now</button><button class="btn-gold" data-act="shop-confirm">Yes, ask</button></div></div></div>`;
  }

  /* ------------------------- monthly Trial of Heracles ------------------------- */

  function testPage() {
    if (O.thisTest()) return `<div class="card center">${O.laurelSVG(90)}<h2>Done for this month</h2><p class="muted">Your results are in the Chronicle. The next Trial opens on the 1st.</p>
      <button class="btn-gold" data-act="tab" data-tab="chronicle">See the results</button></div>`;
    const T = V.test || (V.test = { results: {}, clock: null });
    const prev = S.tests.slice(-1)[0] || null;
    let html = `<div class="card center"><h2>The Trial of Heracles</h2><p class="muted small">Once a month, four tests show how much stronger you have become. Warm up first! Do the ones you can — skip the rest.</p></div>`;
    E.TESTS.forEach((t) => {
      const v = O.n0(T.results[t.id]), was = E.testValue(prev, t.id), clk = T.clock && T.clock.id === t.id ? T.clock : null;
      const f = (x) => (t.mode === 'hold' ? E.fmtSecs(x) : x);
      let tool = '';
      if (t.mode === 'count60') tool = clk ? `<div class="test-clock"><b id="test-live">${Math.max(0, Math.ceil((clk.end - Date.now()) / 1000))}</b><small>seconds left</small><button class="chip" data-act="test-clock-stop">Stop</button></div>`
        : `<button class="btn-line" data-act="test-clock" data-id="${t.id}">▶ Start the 1-minute clock</button>`;
      if (t.mode === 'hold') tool = clk ? `<div class="test-clock run"><b id="test-live">${E.fmtSecs(Math.floor((Date.now() - clk.t0) / 1000))}</b><small>holding…</small><button class="btn-gold" data-act="test-clock-stop">■ Stop</button></div>`
        : `<button class="btn-line" data-act="test-clock" data-id="${t.id}">▶ Start the stopwatch</button>`;
      const step = t.mode === 'hold' ? 5 : 1;
      html += `<div class="card test"><div class="row"><b class="grow">${esc(t.title)}</b>${was ? `<span class="muted small">last time ${f(was)}</span>` : ''}</div>
        <p class="small muted">${esc(t.how)}</p>${tool}
        <div class="test-val"><button class="sb" data-act="test-step" data-id="${t.id}" data-d="${-step}" ${v <= 0 ? 'disabled' : ''}>−</button><b>${v ? f(v) : '—'}</b><button class="sb" data-act="test-step" data-id="${t.id}" data-d="${step}">+</button>
        ${t.mode === 'hold' ? '' : `<button class="chip" data-act="test-step" data-id="${t.id}" data-d="10">+10</button>`}</div></div>`;
    });
    const any = E.TESTS.some((t) => O.n0(T.results[t.id]) > 0);
    return html + `<button class="btn-gold" data-act="test-save" ${any ? '' : 'disabled'}>Write it in the Chronicle${O.n0(S.scoring.testBonus) ? ` · +${O.fmtNum(S.scoring.testBonus)} Glory` : ''}</button>
      <p class="muted small center">You can only do the Trial once a month — save when you have finished.</p>`;
  }

  /* ------------------------------- settings ------------------------------- */

  function settingsPage() {
    const st = O.settings();
    const sw = (k, label, sub) => `<div class="set-line"><div class="grow"><b>${label}</b><div class="muted small">${sub}</div></div>
      <button class="toggle ${st[k] ? 'on' : ''}" data-act="set-toggle" data-k="${k}" aria-pressed="${!!st[k]}"><i></i></button></div>`;
    const sizes = [['normal', 'Normal'], ['large', 'Large'], ['xlarge', 'Extra large']];
    return `<div class="card">${O.section('Settings')}
      ${sw('sound', 'Sound', 'Beeps for timers and the sound of the celebration videos')}
      ${sw('vibrate', 'Vibration', 'Buzz when a timer ends')}
      ${sw('calm', 'Less animation', 'Calmer screens: no sliding, pulsing or fading')}
      <div class="set-line col"><b>Text size</b><div class="chips">${sizes.map(([k, l]) => `<button class="chip ${st.text === k ? 'on' : ''}" data-act="set-text" data-v="${k}">${l}</button>`).join('')}</div></div>
      <p class="muted small">These settings are saved on this phone only.</p></div>
      <div class="center" style="margin:10px 0"><button class="btn-line" data-act="intro-replay">Replay the introduction</button></div>${O.versionHTML()}`;
  }

  /* ------------------------------ guided warm-up ------------------------------ */

  function warmSheet() {
    const moves = E.parseWarmup(O.guideText('warmup')), w = V.warm, m = moves[w.i];
    if (!m) { V.warm = null; return ''; }
    const left = Math.max(0, Math.ceil((w.end - Date.now()) / 1000));
    const img = O.mediaURL('guide_warmup');
    return `<div class="sheet-wrap" data-act="sheet-bg"><div class="sheet center warm">
      <div class="eyebrow-dark">WARM-UP · ${w.i + 1} OF ${moves.length}</div>${img ? `<img class="warm-img" src="${esc(img)}" alt="">` : ''}
      <h2>${esc(m.name)}</h2><div class="warm-clock"><b id="warm-live">${left}</b><small>seconds</small></div>
      ${moves[w.i + 1] ? `<p class="muted small">Next: ${esc(moves[w.i + 1].name)}</p>` : '<p class="muted small">Last one — then the Trial!</p>'}
      <div class="btns"><button class="btn-line" data-act="warm-stop">Stop</button><button class="btn-gold" data-act="warm-next">${moves[w.i + 1] ? 'Next ›' : 'Finish'}</button></div></div></div>`;
  }
  function warmNext() {
    const moves = E.parseWarmup(O.guideText('warmup'));
    const i = V.warm.i + 1;
    if (i >= moves.length) { V.warm = null; keepAwake(false); O.toast('Warmed up — now the Trial!'); return; }
    V.warm = { i, end: Date.now() + moves[i].secs * 1000 };
  }

  /* --------------------------- pairing (first open) --------------------------- */

  function pairScreen() {
    const ready = S.pair && S.pair.ready;
    return `<div class="card center pin-card">${O.laurelSVG(90)}<h2>Welcome to the Path</h2>
      <p class="muted small">${ready ? 'Enter the code the Council gave you. You only do this once on this phone.' : 'The Council has not set your code yet. Ask for it, then open the app again.'}</p>
      ${ready ? `<input id="pair-code" class="pin-box" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="Code">
      ${V.pairMsg ? `<p class="bad small">${esc(V.pairMsg)}</p>` : ''}<button class="btn-gold" data-act="pair-go">Begin</button>` : `<button class="btn-line" data-act="pair-retry">Try again</button>`}</div>`;
  }

  /* --------------------------- first-time walkthrough --------------------------- */

  const INTRO = [
    () => ({ art: O.mediaURL('nav_home'), title: `Welcome, ${O.profile().name || 'hero'}`, text: 'Ten years. One road. Every day you train, you climb a little higher toward Olympus. This app keeps the record of your climb.' }),
    () => ({ art: O.mediaURL('nav_trial'), title: 'Your daily Trial', text: 'Each square is an exercise from today\'s plan. Tap it, enter every set you really did, press OK. When you are finished, close the day — your video and points are waiting.' }),
    () => ({ circles: true, title: 'The Chronicle', text: 'Every day becomes a circle: completed, incomplete, or skipped. A skipped day costs points and breaks your streak — so close every planned day, even a small one.' }),
    () => ({ art: O.mediaURL('medal_first_step'), title: 'Glory and medals', text: 'Points become Glory. Days in a row become your streak. Medals and coats of arms wait in the Hall. The road is mastered by the one who walks it.' }),
  ];
  function introScreen() {
    const step = V.intro, s = INTRO[step]();
    const circles = s.circles ? `<div class="intro-circles">${[['circle_done', 'Completed'], ['circle_incomplete', 'Incomplete'], ['circle_skipped', 'Skipped']].map(([k, l]) => {
      const u = O.mediaURL(k); return `<div>${u ? `<img src="${esc(u)}" alt="">` : `<i class="dot ${k.slice(7)}"></i>`}<span>${l}</span></div>`; }).join('')}</div>` : '';
    return `<div class="intro"><div class="intro-card">
      <div class="intro-art">${circles || (s.art ? `<img src="${esc(s.art)}" alt="">` : O.laurelSVG(150))}</div>
      <h2>${esc(s.title)}</h2><p>${esc(s.text)}</p>
      <div class="intro-dots">${INTRO.map((_, i) => `<i class="${i === step ? 'on' : ''}"></i>`).join('')}</div>
      <div class="intro-btns">${step < INTRO.length - 1 ? '<button class="btn-text" data-act="intro-skip">Skip</button><button class="btn-gold" data-act="intro-next">Next</button>' : '<button class="btn-gold" data-act="intro-done">Begin the path</button>'}</div>
    </div></div>`;
  }

  /* ------------------------------- timers ------------------------------- */

  let wakeLock = null;
  const keepAwake = async (on) => {
    try { if (on && 'wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch (e) { /* not supported */ }
  };
  const beep = () => O.beep();
  function stopSetTimer() {
    if (!V.timer || !V.edit) { V.timer = null; return; }
    const secs = Math.max(1, Math.round((Date.now() - V.timer.t0) / 1000));
    V.edit.draft.perSet[V.timer.i] = secs;
    V.timer = null; keepAwake(false);
  }
  /* live numbers without re-rendering the pop-up */
  setInterval(() => {
    if (V.timer) { const el = document.getElementById('timer-live'); if (el) el.textContent = E.fmtSecs(Math.floor((Date.now() - V.timer.t0) / 1000)); }
    if (V.rest) {
      const left = Math.ceil((V.rest.end - Date.now()) / 1000);
      const el = document.getElementById('rest-live');
      if (left <= 0) { V.rest = null; beep(); O.toast('Rest is over — next set!'); render(); }
      else if (el) el.textContent = E.fmtSecs(left);
    }
    if (V.warm) {
      const left = Math.ceil((V.warm.end - Date.now()) / 1000), el = document.getElementById('warm-live');
      if (left <= 0) { beep(); warmNext(); render(); }
      else if (el) el.textContent = left;
    }
    const clk = V.test && V.test.clock;
    if (clk) {
      const el = document.getElementById('test-live');
      if (clk.mode === 'count60') {
        const left = Math.ceil((clk.end - Date.now()) / 1000);
        if (left <= 0) { V.test.clock = null; keepAwake(false); beep(); O.toast('Time! Enter how many you did.'); render(); }
        else if (el) el.textContent = left;
      } else if (el) el.textContent = E.fmtSecs(Math.floor((Date.now() - clk.t0) / 1000));
    }
  }, 250);
  function timerBar() {
    return `<div class="rest-row">${V.rest ? `<span class="rest-on">Rest <b id="rest-live">${E.fmtSecs(Math.max(0, Math.ceil((V.rest.end - Date.now()) / 1000)))}</b></span><button class="chip" data-act="rest-stop">Stop</button>`
      : `<span class="muted small">Rest timer</span>${[30, 60, 90, 120].map((t) => `<button class="chip" data-act="rest" data-t="${t}">${t < 60 ? t + ' s' : t / 60 + ' min'}</button>`).join('')}`}</div>`;
  }

  /* ------------------------------- render ------------------------------- */

  function render() {
    const app = document.getElementById('app');
    if (S.pair && !S.pair.registered) { app.innerHTML = topbar() + `<main>${pairScreen()}</main>`; return; }
    if (!O.loaded()) {
      app.innerHTML = topbar() + `<div class="loading">${O.laurelSVG(120)}<div>Ascending the mountain…</div></div>`;
      return;
    }
    if (V.intro === null && !localStorage.getItem('olympus_intro_done')) V.intro = 0;
    const views = { home, trial, chronicle, hall, avatar, codex, shop, test: testPage, settings: settingsPage };
    const bg = V.tab === 'hall' ? O.mediaURL('hall_bg') : null;
    document.body.classList.toggle('hall-bg', !!bg);
    document.body.style.backgroundImage = bg ? `url('${bg}')` : '';
    if (O.todayClosed()) { V.edit = null; V.pick = false; V.confirmClose = false; }
    const sheet = V.intro !== null ? introScreen() : V.warm ? warmSheet() : V.shopAsk ? shopSheet() : V.edit ? editorSheet() : V.pick ? pickSheet() : V.confirmClose ? confirmSheet() : '';
    // keep an open pop-up steady: no slide-in again and same scroll position after each tap
    const old = app.querySelector('.sheet'), oldTop = old ? old.scrollTop : 0;
    app.innerHTML = topbar() + `<main>${views[V.tab]()}</main>` + (SUBPAGES.includes(V.tab) ? '' : nav()) + sheet;
    const now = app.querySelector('.sheet');
    if (now && old) { now.classList.add('no-anim'); now.parentElement.classList.add('no-anim'); now.scrollTop = oldTop; }
    document.body.classList.toggle('sheet-open', !!now);
    mountHeroVideo();
    // the newest Council message counts as read once it has been on the home screen
    const m = S.messages[0];
    if (V.tab === 'home' && m && !m.readAt && !readSent.has(m.id) && document.querySelector('.card.message')) { readSent.add(m.id); O.markMessageRead(m.id); }
  }
  const readSent = new Set();

  /* ------------------------------- events ------------------------------- */

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const d = el.dataset;
    switch (d.act) {
      case 'tab':
        if (d.tab === 'avatar') V.photoDraft = undefined;
        if (V.test && V.test.clock && d.tab !== 'test') { V.test.clock = null; keepAwake(false); }
        V.tab = d.tab; window.scrollTo(0, 0); break;
      case 'open-ex': openEditor(d.ex); break;
      case 'pick': V.pick = true; break;
      case 'pick-ex': V.pick = false; openEditor(d.ex); break;
      case 'ed-lv': V.edit.draft.level = +d.lv; break;
      case 'sl-step': case 'sl-del': case 'sl-add':
        if (V.timer) stopSetTimer();
        V.edit.draft.perSet = O.setsEdit(V.edit.exId, V.edit.draft.perSet, d.act, d); break;
      case 'sl-timer': {
        if (V.timer && V.timer.i === +d.i) { stopSetTimer(); break; }
        if (V.timer) stopSetTimer();
        V.timer = { i: +d.i, t0: Date.now() }; V.rest = null; keepAwake(true); break;
      }
      case 'sl-timed-new': {
        if (V.timer) stopSetTimer();
        V.edit.draft.perSet = V.edit.draft.perSet.concat([0]);
        V.timer = { i: V.edit.draft.perSet.length - 1, t0: Date.now() }; V.rest = null; keepAwake(true); break;
      }
      case 'rest': V.rest = { end: Date.now() + +d.t * 1000 }; keepAwake(true); break;
      case 'rest-stop': V.rest = null; keepAwake(false); break;
      case 'intro-next': V.intro = Math.min(INTRO.length - 1, V.intro + 1); break;
      case 'intro-skip': case 'intro-done': V.intro = null; localStorage.setItem('olympus_intro_done', '1'); break;
      case 'intro-replay': V.intro = 0; break;
      case 'pair-retry': O.refreshDavid(); return;
      case 'pair-go': {
        const code = (document.getElementById('pair-code') || {}).value || '';
        if (!/^\d{4,8}$/.test(code)) { V.pairMsg = 'The code is 4–8 digits.'; break; }
        V.pairMsg = '';
        O.pairDevice(code).catch((err) => { V.pairMsg = /permission|denied/i.test(err.code || err.message) ? 'Wrong code — ask the Council.' : 'Could not connect: ' + err.message; render(); });
        return;
      }
      case 'ed-ok': { if (V.timer) stopSetTimer(); keepAwake(false); V.rest = null; const ed = V.edit; V.edit = null; O.updateEntry(ed.exId, (x) => ({ ...x, ...ed.draft })); return; }
      case 'ed-clear': { const ex = V.edit.exId; V.edit = null; O.updateEntry(ex, (x) => ({ ...x, perSet: [] })); return; }
      case 'ed-remove': { const ex = V.edit.exId; V.edit = null; O.removeExtra(ex); return; }
      case 'ed-cancel': case 'sheet-close': V.timer = null; V.rest = null; keepAwake(false); V.edit = null; V.pick = false; V.confirmClose = false; V.shopAsk = null; break;
      case 'sheet-bg': if (e.target !== el || V.intro !== null || V.warm) return; V.timer = null; V.rest = null; keepAwake(false); V.edit = null; V.pick = false; V.confirmClose = false; V.shopAsk = null; break;
      case 'close-day': if (O.todayStats().canClose) V.confirmClose = true; break;
      case 'close-confirm': V.confirmClose = false; O.closeToday(); break;
      case 'goto': { const t = document.getElementById(d.id); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
      case 'month': {
        const [y, m] = V.month.split('-').map(Number);
        V.month = new Date(Date.UTC(y, m - 1 + +d.dir, 1)).toISOString().slice(0, 7); break;
      }
      case 'day': O.modal(O.dayDetailHTML(d.date)); return;
      case 'metric': V.metric = d.metric; break;
      case 'photo-remove': V.photoDraft = null; break;
      case 'save-avatar': O.saveAvatarPhoto(V.photoDraft); V.photoDraft = undefined; V.tab = 'home'; break;
      /* v6 */
      case 'react': O.reactMessage(d.id, d.r); return;
      case 'msgs-all': O.modal(O.messagesListHTML()); return;
      case 'howto': O.modal(O.howToHTML(d.ex, +d.lv)); return;
      case 'shop-ask': V.shopAsk = d.id; break;
      case 'shop-confirm': { const r = S.rewards.find((x) => x.id === V.shopAsk); V.shopAsk = null; if (r) O.requestReward(r).catch((err) => O.toast('Could not send: ' + err.message)); break; }
      case 'req-cancel': if (confirm('Cancel this request? The Glory goes back to your treasury.')) O.backend().deleteDoc('requests', d.id).catch((err) => O.toast(err.message)); return;
      case 'test-step': { const T = V.test; T.results[d.id] = Math.max(0, O.n0(T.results[d.id]) + +d.d); break; }
      case 'test-clock': {
        const t = E.TESTS.find((x) => x.id === d.id);
        V.test.clock = t.mode === 'count60' ? { id: t.id, mode: t.mode, end: Date.now() + 60000 } : { id: t.id, mode: t.mode, t0: Date.now() };
        keepAwake(true); break;
      }
      case 'test-clock-stop': {
        const c = V.test.clock; V.test.clock = null; keepAwake(false);
        if (c && c.mode === 'hold') V.test.results[c.id] = Math.max(1, Math.round((Date.now() - c.t0) / 1000));
        break;
      }
      case 'test-save': {
        const res = Object.fromEntries(Object.entries(V.test.results).filter(([, v]) => O.n0(v) > 0));
        if (!Object.keys(res).length) break;
        if (!confirm('Save this month\'s Trial? You can only do it once a month.')) return;
        if (O.saveTest(res)) { V.test = null; V.tab = 'home'; window.scrollTo(0, 0); }
        break;
      }
      case 'set-toggle': O.setSetting(d.k, !O.settings()[d.k]); break;
      case 'set-text': O.setSetting('text', d.v); break;
      case 'warm-start': { const ms = E.parseWarmup(O.guideText('warmup')); if (ms.length) { V.warm = { i: 0, end: Date.now() + ms[0].secs * 1000 }; keepAwake(true); } break; }
      case 'warm-next': warmNext(); break;
      case 'warm-stop': V.warm = null; keepAwake(false); break;
      case 'demo-next': case 'demo-today': case 'demo-wipe': O.demoAction(d.act); return;
      default: return;
    }
    render();
  });

  document.addEventListener('change', async (e) => {
    const el = e.target, d = el.dataset;
    if (d.change === 'photo' && el.files && el.files[0]) {
      try { V.photoDraft = await O.photoToDataURL(el.files[0]); render(); }
      catch (err) { O.toast(err.message); }
    }
  });

  O.onChange(render);
  render();
  O.start('david');

  O.watchUpdates();
})();
</script>
</body>
</html>
