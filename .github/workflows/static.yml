# Deploy the PathToOlympus_Site folder to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Pictures or videos uploaded to the top of the repository by mistake
      # are moved into PathToOlympus_Site/media (and the move is saved).
      - name: Move media dropped in the repo root
        run: |
          shopt -s nullglob nocaseglob
          files=(*.webp *.png *.jpg *.jpeg *.gif *.mp4)
          if [ ${#files[@]} -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            for f in "${files[@]}"; do git mv -f "$f" "PathToOlympus_Site/media/$f"; echo "moved $f"; done
            git commit -m "Move uploaded media into PathToOlympus_Site/media"
            git push
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: PathToOlympus_Site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
